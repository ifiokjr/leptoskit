name: devenv
description: Setup development environment with devenv
inputs:
  github-token:
    description: Provide a github token
    required: true
  nix-cache:
    description: The location of the nix cache
    required: true

runs:
  using: composite
  steps:
    - name: free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        df -h
      shell: bash

    - name: cache nix store
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      id: nix-cache
      with:
        path: ${{ inputs.nix-cache }}
        key: ${{ runner.os }}-nix-cache-${{ hashFiles('**/devenv.nix', '**/devenv.yaml', '**/devenv.lock') }}
        restore-keys: ${{ runner.os }}-nix-cache-

    - name: install nix
      uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
      with:
        github_access_token: ${{ inputs.github-token }}

    - name: import nix store cache
      if: steps.nix-cache.outputs.cache-hit == 'true'
      run: nix-store --import < ${{ inputs.nix-cache }}
      shell: bash

    - name: enable cachix
      uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
      with:
        name: devenv

    - name: install devenv.sh
      run: |
        cachix use devenv
        nix profile install --accept-flake-config nixpkgs#devenv
      shell: bash

    - name: build developer environment
      # `devenv shell` builds and enters the environment (installing the git
      # hooks) without running them: the pre-commit format hook shells out to
      # leptosfmt, whose rustfmt resolves through rustup, and on a cold runner
      # the parallel formatting workers race the toolchain download. The hooks
      # run for real when a commit is pushed, after install:all has settled
      # the toolchain.
      run: devenv shell true
      shell: bash

    - name: update path with devenv
      run: devenv shell setup:ci
      shell: bash

    - name: export nix store cache
      if: steps.nix-cache.outputs.cache-hit != 'true'
      run: nix-store --export $(find /nix/store -maxdepth 1 -name '*-*')> ${{ inputs.nix-cache }}
      shell: bash

    - name: cache rust dependencies
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        prefix-key: "v0-rust"
        key: ${{ runner.os }}

    - name: cache cargo binaries
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ./.bin
        key: ${{ runner.os }}-cargo-bin-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-bin-

    - name: install dependencies
      run: install:all
      shell: bash
      env:
        # cargo-binstall finds release artifacts through the GitHub API. An
        # unauthenticated runner shares a small rate limit, and once it is
        # spent binstall falls back to source builds that cannot succeed here.
        GITHUB_TOKEN: ${{ inputs.github-token }}
