# zizmor configuration
# https://docs.zizmor.sh/configuration/
#
# zizmor discovers this file automatically when scanning workflows.
# It is located at .github/zizmor.yml per the local discovery rules.
#
# Policy: the `security:zizmor` gate requires every workflow and composite
# action to pass all offline audits with zero findings. Credential persistence
# stays disabled in every checkout that does not need to authenticate.
# If an ignore is ever required, add the rule below with a comment explaining
# why the pattern is intentional and why it is safe.

rules:
  # The rust action exports the toolchain channel that rustup resolved from
  # the repository's own rust-toolchain.toml, so generated apps building
  # outside the checkout still use the pin. The value is one field of a
  # `cut` split of rustup's output, so it can never carry a newline into
  # the environment file, and nothing attacker-influenced reaches the write.
  # zizmor matches ignores by file name alone, so this covers every
  # `action.yml`; the devenv action writes no environment file.
  github-env:
    ignore:
      - action.yml

  # Local composite actions (`uses: ./.github/actions/...`) are reviewed in
  # the same pull requests that modify them, so there is no third-party trust
  # boundary to harden; the self-repository audit would otherwise flag every
  # intentional local action reference.
  self-repository:
    ignore:
      - benchmarks.yml
      - ci.yml
      - docs.yml
      - publish.yml
      - release.yml
