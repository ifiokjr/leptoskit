name: native UI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  # Every build re-checks the crates.io sparse index, and transient download
  # failures of index files failed whole jobs (config.json, rquickjs,
  # serde_core). Cargo retries spurious network errors with backoff; three
  # attempts were not enough on hosted runners.
  CARGO_NET_RETRY: 10
# Superseded pull request and branch runs are cancelled; a run on main never
# is, so main always gets a complete native verdict.
concurrency:
  group: native-ui-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  mobile:
    name: native ${{ matrix.platform }} dialogs and pixels
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            os: macos-latest
          - platform: android
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The simulator boots and WebDriverAgent builds while the job compiles.
      # A session that did both itself spent eight minutes before its first
      # command, and launching the app on the just-booted device then outlasted
      # WebDriverAgent's 60 second createSession window.
      - name: start the job's simulator
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          read -r runtime device_type < <(xcrun simctl list runtimes available --json | jq -er '
            [.runtimes[] | select(.platform == "iOS")]
            | sort_by(.version | split(".") | map(tonumber)) | last
            | "\(.identifier) \([.supportedDeviceTypes[] | select(.name | test("^iPhone [0-9]+$"))]
              | sort_by(.name | ltrimstr("iPhone ") | tonumber) | last | .identifier)"')
          udid="$(xcrun simctl create "Leptoskit native UI" "$device_type" "$runtime")"
          xcrun simctl boot "$udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          echo "SIMULATOR_BOOT_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: install native driver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/native-ui
          npm ci --prefix setup/native-ui
      - name: start building WebDriverAgent
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          # The build outlives this step and logs outside target/, which the
          # rust cache restores over. Its exit status lands in wda.status.
          (
            status=0
            bash setup/scripts/native_wda_build.sh "$SIMULATOR_UDID" "$RUNNER_TEMP/wda" || status=$?
            echo "$status" >"$RUNNER_TEMP/wda.status"
          ) >"$RUNNER_TEMP/wda-build.log" 2>&1 </dev/null &
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: build native test runner
        run: cargo build --locked -p leptoskit_testing --features native-ui --example native_conformance
      - name: test iOS native permissions
        if: matrix.platform == 'ios'
        shell: bash
        env:
          NATIVE_WDA_DERIVED_DATA: ${{ runner.temp }}/wda
        run: |
          set -euo pipefail
          # Hosted boots have taken over five minutes, and under the compile's load
          # one was not confirmed ready until almost eight. A device still booting
          # fifteen minutes after it started is wedged; fail here rather than hand
          # Appium a half-booted simulator. Wait for the boot first so its logged
          # time is accurate.
          boot_deadline=$((SIMULATOR_BOOT_STARTED + 900))
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b &
          boot=$!
          while kill -0 "$boot" 2>/dev/null; do
            if [ "$(date +%s)" -ge "$boot_deadline" ]; then
              kill "$boot"
              echo "Simulator $SIMULATOR_UDID did not finish booting within 900 seconds" >&2
              xcrun simctl list devices >&2
              exit 1
            fi
            sleep 5
          done
          wait "$boot"
          echo "Simulator ready by $(($(date +%s) - SIMULATOR_BOOT_STARTED)) seconds after boot started"
          deadline=$((SECONDS + 900))
          until [ -f "$RUNNER_TEMP/wda.status" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "WebDriverAgent build timed out" >&2
              exit 1
            fi
            sleep 5
          done
          cp "$RUNNER_TEMP/wda-build.log" target/native-ui/wda-build.log
          if [ "$(cat "$RUNNER_TEMP/wda.status")" != 0 ]; then
            tail -n 80 target/native-ui/wda-build.log >&2
            exit 1
          fi
          bash setup/scripts/native_mobile_run.sh ios "$SIMULATOR_UDID"
      - name: enable KVM
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # With retries, so android-emulator-runner's own unretried install finds
      # every package current and downloads nothing.
      - name: install the android sdk packages
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          bash setup/scripts/android_sdk_install.sh \
            emulator "system-images;android-35;default;x86_64" "platforms;android-35" "build-tools;37.0.0" platform-tools
      - name: test Android native permissions
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash setup/scripts/native_mobile_run.sh android emulator-5554
      - name: retain native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.platform }}
          path: |
            target/native-ui/reports
            target/native-ui/*.log
  macos:
    name: native macOS dialogs and pixels
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: build native test runners and the dialog plugin fixture
        run: |
          cargo build --locked -p leptoskit_testing --features native-ui --example native_conformance --example dialog_plugin_journey
          cargo build --locked -p leptoskit_plugin_dialog --example native_fixture
      - name: install native driver
        run: npm ci --prefix setup/native-ui
      # XCTest asks for an administrator before it drives the UI unless
      # Automation Mode is allowed without authentication.
      - name: allow UI automation
        run: |
          sudo automationmodetool enable-automationmode-without-authentication
          automationmodetool
      - name: test native macOS dialogs
        run: bash setup/scripts/native_macos_run.sh
      - name: retain native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-macos
          path: |
            target/native-ui/reports
            target/native-ui/*.log
  windows:
    name: native Windows dialogs and pixels
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked -p leptoskit_testing --features native-ui --example native_conformance
      - name: test native Windows file chooser
        shell: pwsh
        run: ./setup/scripts/native_windows_run.ps1
      - name: retain native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-windows
          path: |
            target/native-ui/reports
            target/native-ui/*.log
  linux:
    name: native Linux dialogs and pixels
    # Its 6.8 Azure kernel supplies vgem; newer Azure kernels omit it.
    # The desktop itself runs Ubuntu 26.04 in the container.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: install the GTK4 dialog fixture's development libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev pkg-config
      - run: cargo build --locked -p leptoskit_testing --features native-ui --example native_conformance --example dialog_plugin_journey
      - run: cargo build --locked -p leptoskit_plugin_dialog --example native_fixture
      - name: enable software OpenGL buffer allocation
        run: |
          if ! modinfo vgem >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          fi
          sudo modprobe vgem
          sudo udevadm settle
          sudo chmod a+rw /dev/dri/*
      - name: build isolated native Linux desktop
        run: docker build --build-arg NATIVE_UID="$(id -u)" --build-arg NATIVE_GID="$(id -g)" -t leptoskit-native-linux -f setup/native-ui/Dockerfile .
      - name: test native Linux dialogs
        run: docker run --rm --device /dev/dri --user "$(id -u):$(id -g)" -e HOME=/tmp/native-home -v "$PWD:/workspace" leptoskit-native-linux
      - name: retain native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-linux
          path: |
            target/native-ui/reports
            target/native-ui/driver
            target/native-ui/linux/*.log
