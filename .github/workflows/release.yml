name: release

# Creates and maintains the release pull request, and rehearses that creation on every pull request.
#
# A release is driven by changesets: a feature branch adds a changeset describing its version bump,
# and this workflow keeps exactly one release PR open summarizing what the next version contains.
# Merging that PR is what cuts the release, so the decision to release is a merge rather than a tag
# pushed by hand.
#
# The release schedule is therefore "whenever the release PR is merged". Changesets accumulate on
# main until someone merges that PR, which is the only gate on shipping.
#
# The pull-request job is a rehearsal: it runs the same validation, release planning, lockfile
# refreshes, and formatting as the real release, but commits and opens nothing. A broken release
# preparation therefore fails on the pull request that caused it instead of days later on main.

on:
  push:
    branches: [main]
  pull_request: {}
  # Running by hand refreshes the release PR; tags are only ever cut from a merged release commit.
  workflow_dispatch:

permissions:
  contents: read

# Release-PR refreshes supersede each other, so a newer push cancels an older one. A release
# commit gets its own group and is never cancelled: stopping it after the tag is created but
# before `publish` is dispatched would leave a half-finished release that nothing resumes.
concurrency:
  group: release-${{ github.ref }}-${{ github.event_name != 'pull_request' && startsWith(github.event.head_commit.message, 'chore(release)') && 'post-merge' || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'chore(release)') }}

jobs:
  release-pr:
    name: release pr
    # A release PR commit is generated by this workflow, so re-running it on its own output would
    # create a second release PR describing the first. Pull requests run the rehearsal job instead.
    if: "github.event_name != 'pull_request' && !startsWith(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The release commit and branch are pushed with the job token, and the pull request is opened
      # or updated through the API. Labels are attached through the issues API.
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # monochange reads history to build the changelog, so a shallow clone would produce a
          # release PR with an incomplete entry list.
          fetch-depth: 0
          # Credential persistence stays off until the release step, which authenticates only the
          # push it needs. Nothing else in the job can write to the repository.
          persist-credentials: false

      - uses: ./.github/actions/rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: dprint

      - name: install cargo-binstall
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-binstall

      - name: install monochange
        run: |
          set -euo pipefail
          cargo binstall --no-confirm --disable-strategies compile monochange@0.21.0 \
            || cargo install --locked --version 0.21.0 monochange

      - name: validate the release configuration
        run: monochange step validate

      - name: check the workspace and changesets
        run: monochange check

      - name: report pending changesets
        id: pending
        run: |
          set -euo pipefail

          # A missing or empty changeset directory is the normal state right after a release, and
          # it should refresh the release PR rather than fail. The directory is checked rather than
          # having its absence ignored: `find` exits non-zero on a missing directory, and `pipefail`
          # turns that into a failing assignment.
          if [ -d .changeset ]; then
            count=$(find .changeset -name '*.md' -type f | wc -l | tr -d ' ')
          else
            count=0
          fi

          # Normalized to a bare integer so the comparison below is numeric rather than string-wise.
          case "$count" in
            ''|*[!0-9]*) count=0 ;;
          esac

          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Pending changesets: $count"

      - name: authenticate the release push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The checkout keeps credentials out of .git/config, so the release commit gets push
          # access only here. The header is the same one actions/checkout would have written.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git config --local "http.https://github.com/.extraheader" "AUTHORIZATION: basic ${auth}"

      - name: open or update the release pull request
        env:
          # monochange reads both names: GH_TOKEN for git and the GitHub API, GITHUB_TOKEN for the
          # verified-commit path.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Write the release commit and branch locally, then open the pull request with the job
          # token. The hosted backend depended on monochange.dev being reachable, which failed every
          # main run for days; this path has no external release service.
          MONOCHANGE_RELEASE_BACKEND: local
          # A commit created with the job token does not trigger workflows on its own, so the
          # release commit is unsigned unless monochange replaces it through the Git Database API.
          # That replacement is attempted automatically when `verified_commits` is on.
          #
          # Passed through the environment rather than interpolated into the script: a `${{ }}`
          # expression is substituted as text, so a shell comparison against it is a comparison
          # against a literal that shellcheck cannot type-check.
          PENDING: ${{ steps.pending.outputs.count }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          if [ "$PENDING" -eq 0 ]; then
            echo "No pending changesets; nothing to release."
            exit 0
          fi

          monochange run release --commit --create-pr

  # Every pull request rehearses the release it would contribute to. It runs the same validation,
  # planning, lockfile refreshes, and formatting as `release-pr`, but never commits or opens a pull
  # request, so a release problem shows up on the change that caused it.
  release-pr-simulated:
    name: release pr (simulated)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The rehearsal reads the workspace and may enrich changesets from the GitHub API. It writes
      # nothing.
      contents: read
      pull-requests: read
      issues: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # monochange reads history to build the changelog, so a shallow clone would produce a
          # release preview with an incomplete entry list.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: dprint

      - name: install cargo-binstall
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-binstall

      - name: install monochange
        run: |
          set -euo pipefail
          cargo binstall --no-confirm --disable-strategies compile monochange@0.21.0 \
            || cargo install --locked --version 0.21.0 monochange

      - name: validate the release configuration
        run: monochange step validate

      - name: check the workspace and changesets
        run: monochange check

      - name: report pending changesets
        id: pending
        run: |
          set -euo pipefail

          # A missing or empty changeset directory is the normal state right after a release, and
          # it means there is no release pull request to rehearse.
          if [ -d .changeset ]; then
            count=$(find .changeset -name '*.md' -type f | wc -l | tr -d ' ')
          else
            count=0
          fi

          # Normalized to a bare integer so the comparison below is numeric rather than string-wise.
          case "$count" in
            ''|*[!0-9]*) count=0 ;;
          esac

          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Pending changesets: $count"

      - name: simulate the release pull request
        env:
          # A pull request from a fork gets a read-only token rather than the repository's secrets.
          # The rehearsal only reads, so the built-in token is enough.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          # No external release service is involved, which is also how the real release now runs.
          MONOCHANGE_RELEASE_BACKEND: local
          # Passed through the environment rather than interpolated into the script: a `${{ }}`
          # expression is substituted as text, so a shell comparison against it is a comparison
          # against a literal that shellcheck cannot type-check.
          PENDING: ${{ steps.pending.outputs.count }}
        run: |
          set -euo pipefail

          # Dry-run plans every step, including the release commit and the pull request, without
          # writing files or contacting GitHub. This is where a broken release configuration or
          # request body fails.
          monochange run release --dry-run --commit --create-pr

          if [ "$PENDING" -eq 0 ]; then
            echo "No pending changesets; there is no release pull request to prepare."
            exit 0
          fi

          # Prepare the release for real, still without committing or opening a pull request. This
          # runs the lockfile refreshes and the formatter exactly as the release job does, so a
          # missing standalone-workspace lockfile fails here rather than on main.
          monochange run release

      - name: verify the prepared release
        if: steps.pending.outputs.count != '0'
        run: |
          set -euo pipefail

          # Every standalone workspace records the SDK crates by path, so each lockfile has to name
          # the versions this release prepared. CI builds all of them with `--locked`.
          for manifest in \
            Cargo.toml \
            examples/file_routes/Cargo.toml \
            benchmarks/arena/apps/leptoskit/Cargo.toml \
            crates/leptoskit_cli/tests/fixtures/app-service/Cargo.toml
          do
            cargo metadata --locked --no-deps --format-version 1 --manifest-path "$manifest" >/dev/null
          done

          # The release step formats what it writes; prove those files stayed clean. `--dirty`
          # limits the check to release output: this job installs dprint and its JSON, Markdown,
          # and TOML plugins, but not the shell, nix, and SQL formatters that a whole-tree check
          # would also invoke.
          dprint check --dirty

          # Catch whitespace errors in the generated manifests and changelogs.
          git diff --check

          echo "Release preparation succeeded; no release commit or pull request was created."

  # The half of the release flow that runs after the release PR is merged. The release-pr job above
  # prepares the PR; merging it lands the `chore(release)` commit on main, and this job is what
  # makes that merge cut a release: it pushes the tag, creates the draft GitHub release with the
  # notes from the release record, and dispatches publish.yml.
  release-post-merge:
    name: tag and draft the release
    # Runs only when the pushed commit is itself a release commit. The release-pr job has the
    # inverse condition, so the two halves never both run on the same push. Pull request events
    # have no head commit and are excluded explicitly.
    if: "github.event_name != 'pull_request' && startsWith(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Creating the tag ref and the draft release needs write on contents, and dispatching
      # publish.yml at the end needs write on actions. Both go through the GitHub API with the
      # job token rather than through the git config of every later step.
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The release record is matched against first-parent ancestry, and the draft release
          # copies changelogs from the tree, so the history and the files both have to be present.
          fetch-depth: 0
          persist-credentials: false

      - name: install cargo-binstall
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-binstall

      - name: install monochange
        run: |
          set -euo pipefail
          cargo binstall --no-confirm --disable-strategies compile monochange@0.21.0 \
            || cargo install --locked --version 0.21.0 monochange

      - name: confirm the commit is a release commit
        id: record
        # A commit whose subject says `chore(release)` but which carries no release record is a
        # hand-written lookalike. Failing here is better than tagging whatever it happens to
        # contain: the record is the authority on what version and what packages the tag names.
        run: |
          set -euo pipefail

          is_release_commit="$(monochange step release-record --from HEAD --format json \
            --jq '.resolved_commit == .record_commit')"

          if [ "$is_release_commit" != "true" ]; then
            echo "::error::HEAD looks like a release commit but carries no release record."
            exit 1
          fi

      - name: create the release tag
        # The checkout persists no credentials, so the tag is created through the API with the job
        # token instead of `git push`. A draft release cannot stand in for it: GitHub only creates
        # a draft's tag when the release is published, and publish.yml is dispatched on the tag.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="$(monochange step release-record --from HEAD --format json --jq '.version')"
          tag="v${version}"
          sha="$(git rev-parse HEAD)"

          # A retry after a partial release finds the tag already created, which is the expected
          # state rather than a conflict, as long as it names this commit.
          if existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha' 2>/dev/null)"; then
            if [ "$existing" != "$sha" ]; then
              echo "::error::Tag ${tag} already exists at ${existing}, not ${sha}."
              exit 1
            fi
            echo "Tag ${tag} already exists; continuing."
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" \
              -f sha="$sha" >/dev/null
            echo "Created tag ${tag} at ${sha}."
          fi

      - name: create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="$(monochange step release-record --from HEAD --format json --jq '.version')"
          tag="v${version}"

          # The draft exists so publish.yml can attach artifacts to it and flip it public only
          # after every registry accepted every package.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Draft release ${tag} already exists; continuing."
          else
            gh release create "$tag" \
              --draft \
              --title "v${version}" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: dispatch the publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="$(monochange step release-record --from HEAD --format json --jq '.version')"
          gh workflow run publish.yml \
            --ref "v${version}" \
            -f tag="v${version}"
