name: release

# Creates and maintains the release pull request.
#
# A release is driven by changesets: a feature branch adds a changeset describing its version bump,
# and this workflow keeps exactly one release PR open summarizing what the next version contains.
# Merging that PR is what cuts the release, so the decision to release is a merge rather than a tag
# pushed by hand.
#
# The release schedule is therefore "whenever the release PR is merged". Changesets accumulate on
# main until someone merges that PR, which is the only gate on shipping.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to cut when running by hand (for example v0.1.0). Leave empty to only refresh the release PR."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-pr:
    name: release pr
    # A release PR commit is generated by this workflow, so re-running it on its own output would
    # create a second release PR describing the first.
    if: "!startsWith(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Writing the branch and the pull request needs both, and the token is scoped to this job
      # rather than the whole workflow.
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # monochange reads history to build the changelog, so a shallow clone would produce a
          # release PR with an incomplete entry list.
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.90.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: dprint

      - name: install monochange
        run: cargo binstall --no-confirm monochange@0.16.0 || cargo install monochange --version 0.16.0 --locked

      - name: configure the release commit identity
        # A fresh runner has no git identity, and the release commit fails with "Author identity
        # unknown" without one. The identity is the release bot rather than a person, so the commit
        # says which automated run produced it.
        run: |
          set -euo pipefail

          git config user.name "leptoskit release bot"
          git config user.email "release@leptoskit.dev"

      - name: validate the release configuration
        run: monochange step validate

      - name: check the workspace and changesets
        run: monochange check

      - name: report pending changesets
        id: pending
        run: |
          set -euo pipefail

          # A missing or empty changeset directory is the normal state right after a release, and
          # it should refresh the release PR rather than fail. The directory is checked rather than
          # having its absence ignored: `find` exits non-zero on a missing directory, and `pipefail`
          # turns that into a failing assignment.
          if [ -d .changeset ]; then
            count=$(find .changeset -name '*.md' -type f | wc -l | tr -d ' ')
          else
            count=0
          fi

          # Normalized to a bare integer so the comparison below is numeric rather than string-wise.
          case "$count" in
            ''|*[!0-9]*) count=0 ;;
          esac

          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Pending changesets: $count"

      - name: open or update the release pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through the environment rather than interpolated into the script: a `${{ }}`
          # expression is substituted as text, so a shell comparison against it is a comparison
          # against a literal that shellcheck cannot type-check.
          PENDING: ${{ steps.pending.outputs.count }}
          # The checkout disables credential persistence so the token is not written into `.git/config`
          # for every later step to inherit. Pushing the release branch still needs it, so it is
          # supplied through a helper that exists only for this command.
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$PENDING" -eq 0 ]; then
            echo "No pending changesets; nothing to release."
            exit 0
          fi

          # The value is single-quoted on purpose: git runs it through its own shell, which is what
          # expands `$RELEASE_TOKEN`. Expanding it here instead would bake the token into the git
          # configuration in plaintext.
          # shellcheck disable=SC2016
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.https://github.com.helper
          # shellcheck disable=SC2016
          export GIT_CONFIG_VALUE_0='!f() { echo "username=x-access-token"; echo "password=$RELEASE_TOKEN"; }; f'

          monochange run release --commit --create-pr

  # The half of the release flow that runs after the release PR is merged. The release-pr job above
  # prepares the PR; merging it lands the `chore(release)` commit on main, and this job is what
  # makes that merge cut a release: it pushes the tag, creates the draft GitHub release with the
  # notes from the release record, and dispatches publish.yml.
  release-post-merge:
    name: tag and draft the release
    # Runs only when the pushed commit is itself a release commit. The release-pr job has the
    # inverse condition, so the two halves never both run on the same push.
    if: "startsWith(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Pushing the tag needs write on contents, the draft release carries the token into the
      # GitHub API rather than into the git config of every later step, and dispatching publish.yml
      # at the end needs write on actions.
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The release record is matched against first-parent ancestry, and the draft release
          # copies changelogs from the tree, so the history and the files both have to be present.
          fetch-depth: 0
          persist-credentials: false

      - name: install monochange
        run: cargo binstall --no-confirm monochange@0.16.0 || cargo install monochange --version 0.16.0 --locked

      - name: confirm the commit is a release commit
        id: record
        # A commit whose subject says `chore(release)` but which carries no release record is a
        # hand-written lookalike. Failing here is better than tagging whatever it happens to
        # contain: the record is the authority on what version and what packages the tag names.
        run: |
          set -euo pipefail

          is_release_commit="$(monochange step release-record --from HEAD --format json \
            --jq '.resolved_commit == .record_commit')"

          if [ "$is_release_commit" != "true" ]; then
            echo "::error::HEAD looks like a release commit but carries no release record."
            exit 1
          fi

      - name: push the release tag
        run: |
          set -euo pipefail

          version="$(monochange step release-record --from HEAD --format json --jq '.version')"
          tag="v${version}"

          # A retry after a partial release finds the tag already pushed, which is the expected
          # state rather than a conflict.
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists; continuing."
          else
            git tag "$tag"
            git push origin "$tag"
          fi

      - name: create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="$(monochange step release-record --from HEAD --format json --jq '.version')"
          tag="v${version}"

          # The draft exists so publish.yml can attach artifacts to it and flip it public only
          # after every registry accepted every package.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Draft release ${tag} already exists; continuing."
          else
            gh release create "$tag" \
              --draft \
              --title "v${version}" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: dispatch the publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="$(monochange step release-record --from HEAD --format json --jq '.version')"
          gh workflow run publish.yml \
            --ref "v${version}" \
            -f tag="v${version}"
