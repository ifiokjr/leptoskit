name: docs

# Builds the documentation site on every pull request that could change it,
# and deploys it to GitHub Pages from main. The site is the book in docs/src,
# built by docs/site with leptoskit_docs, so a broken link, an unknown
# component, or a bad prop fails this check before it can ship.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "crates/leptoskit_docs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/actions/rust/**"
      - ".github/workflows/docs.yml"

  pull_request:
    paths:
      - "docs/**"
      - "crates/leptoskit_docs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/actions/rust/**"
      - ".github/workflows/docs.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: install rust
        uses: ./.github/actions/rust

      - name: cache rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: docs

      - name: build the site
        run: cargo run --locked --release --package leptoskit_docs_site -- build --out docs/dist

      - name: verify public schema assets
        run: |
          cmp docs/src/schema.json docs/dist/schema.json
          for schema in docs/src/schemas/leptoskit*.schema.json; do
            cmp "$schema" "docs/dist/schemas/$(basename "$schema")"
          done

      - name: upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    name: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Deploying to Pages needs these two, scoped to this job alone.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: configure pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
