name: docs

# Builds the public website on every pull request that could change it, and
# deploys it to GitHub Pages from main. The artifact is the real public-only
# packager output: the landing page with its live Wasm example at the root,
# the book from docs/src under /docs/, and the schema aliases at their stable
# root paths — with no console entrypoint. The same packaging runs in the
# hosted pilot workflow with the console for operators, so a broken link, an
# unknown component, or a bad prop fails this check before it can ship.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "crates/leptoskit_app/**"
      - "crates/leptoskit_cli/**"
      - "crates/leptoskit_docs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/actions/rust/**"
      - ".github/workflows/docs.yml"

  pull_request:
    paths:
      - "docs/**"
      - "crates/leptoskit_app/**"
      - "crates/leptoskit_cli/**"
      - "crates/leptoskit_docs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/actions/rust/**"
      - ".github/workflows/docs.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: install rust
        uses: ./.github/actions/rust

      - name: cache rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: docs

      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake pkg-config libssl-dev

      # Release builds optimize the browser client with `wasm-opt`; this is
      # the binaryen release devenv provides and the release job pins.
      - name: install binaryen
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/binaryen.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz \
            -o "$archive"
          echo "195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_132/bin" >> "$GITHUB_PATH"

      # The packaging tools are native and run once, so a debug build is
      # enough for them; `--release` below applies to the shipped browser
      # client instead.
      - name: build the packaging tools
        run: |
          cargo build --locked -p leptoskit_cli --bin leptoskit
          cargo build --locked -p leptoskit_app --features site --bin leptoskit-site

      - name: package the public website
        run: |
          set -euo pipefail
          target/debug/leptoskit-site --public-only --url https://leptoskit.dev \
            --cli target/debug/leptoskit --out "$PWD/docs/dist" --release

      - name: verify the public artifact
        run: |
          set -euo pipefail
          test -f docs/dist/index.html
          test -f docs/dist/docs/index.html
          test -f docs/dist/docs/_leptoskit/search.json
          test -f docs/dist/pkg/leptoskit_app_bg.wasm
          test ! -e docs/dist/console
          grep -q 'id="live-demo"' docs/dist/index.html
          if grep -q '/console' docs/dist/index.html; then
            echo "the public landing page must not offer the console" >&2
            exit 1
          fi

      # A client bundle that never mounts the live example still loads
      # without an error, so only a real browser notices it. The runner image
      # ships Google Chrome.
      - name: install deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.8.0

      - name: verify the live example in chrome
        run: |
          LEPTOSKIT_SITE=docs/dist deno test --allow-env --allow-read --allow-net \
            --allow-run --allow-write crates/leptoskit_app/tests/live_example.mjs

      - name: verify public schema assets
        run: |
          cmp docs/src/schema.json docs/dist/schema.json
          cmp docs/src/schema.json docs/dist/docs/schema.json
          for schema in docs/src/schemas/leptoskit*.schema.json; do
            cmp "$schema" "docs/dist/schemas/$(basename "$schema")"
            cmp "$schema" "docs/dist/docs/schemas/$(basename "$schema")"
          done

      - name: upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    name: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Deploying to Pages needs these two, scoped to this job alone.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: configure pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
