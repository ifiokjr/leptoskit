name: hosted pilot

on:
  pull_request:
    paths:
      - "crates/leptoskit_app/**"
      - "crates/leptoskit_deploy_console/**"
      - "crates/leptoskit_cli/**"
      - "crates/leptoskit_config/**"
      - "docs/**"
      - "setup/scripts/*hosted_pilot*"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/actions/rust/**"
      - ".github/workflows/hosted-pilot.yml"
  workflow_dispatch:
    inputs:
      public_origin:
        description: Public HTTPS origin for the pilot artifact
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hosted-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Linux bundle and recovery drill
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      PUBLIC_ORIGIN: ${{ inputs.public_origin || 'https://pilot.example.test' }}
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Native packages use Ubuntu's compiler and loader. A Nix-linked broker
      # would not run on the pilot's ordinary Ubuntu host.
      - name: install rust
        uses: ./.github/actions/rust

      - name: cache rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: hosted-pilot

      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake pkg-config libssl-dev

      - name: install pinned browser optimizer
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/binaryen.tar.gz" \
            https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz
          echo "195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_132/bin" >> "$GITHUB_PATH"

      - name: install pinned OpenTofu
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/tofu.zip" \
            https://github.com/opentofu/opentofu/releases/download/v1.13.1/tofu_1.13.1_linux_amd64.zip
          echo "8ccbc6f8ee21d2827715f3c6e08a9b3e0209b1e62057c05067ef117e047c1a80  $RUNNER_TEMP/tofu.zip" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/pilot-tofu"
          unzip -q "$RUNNER_TEMP/tofu.zip" -d "$RUNNER_TEMP/pilot-tofu"

      # The drill's outputs go beside the runner's temp dir, never into
      # target/: rust-cache persists whatever sits in target/, and the
      # packaging script rightly refuses to overwrite an earlier release,
      # so a cached output made every run after the first fail. The runner
      # context is not allowed in job-level env, so each step names the
      # path itself.
      - name: package the Linux broker and complete website
        run: |
          PILOT_DIR="$RUNNER_TEMP/hosted-pilot"
          bash setup/scripts/package_hosted_pilot.sh "$PUBLIC_ORIGIN" "$PILOT_DIR"

      - name: validate the implemented DigitalOcean OpenTofu integration
        run: |
          PILOT_DIR="$RUNNER_TEMP/hosted-pilot"
          python3 setup/scripts/check_hosted_pilot_infra.py \
            --cli target/x86_64-unknown-linux-gnu/release/leptoskit \
            --tofu "$RUNNER_TEMP/pilot-tofu/tofu" > "$PILOT_DIR-infra.json"

      - name: verify archive and run recovery acceptance
        run: |
          set -euo pipefail
          PILOT_DIR="$RUNNER_TEMP/hosted-pilot"
          mkdir -p "$PILOT_DIR-unpacked"
          tar -xzf "$PILOT_DIR.tar.gz" -C "$PILOT_DIR-unpacked"
          (cd "$PILOT_DIR-unpacked" && sha256sum --check --strict SHA256SUMS)
          mkdir -p "$PILOT_DIR-smoke/checks"
          cp -a "$PILOT_DIR-unpacked" "$PILOT_DIR-smoke/bundle"
          cp setup/scripts/hosted_pilot_local.py setup/scripts/hosted_pilot_smoke.py "$PILOT_DIR-smoke/checks/"
          cp crates/leptoskit_app/deploy/Smoke.Dockerfile "$PILOT_DIR-smoke/Dockerfile"
          docker build --tag leptoskit-hosted-pilot-smoke "$PILOT_DIR-smoke"
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777 \
            leptoskit-hosted-pilot-smoke > "$PILOT_DIR-acceptance.json"
          # Verify systemd syntax against the actual installed layout in this
          # disposable runner; no service is started and no credentials exist.
          sudo install -d /opt/leptoskit-cloud/current
          sudo install -m 0755 "$PILOT_DIR-unpacked/leptoskit-cloud" /opt/leptoskit-cloud/current/
          sudo install -m 0644 "$PILOT_DIR-unpacked/systemd/leptoskit-cloud.sysusers" /usr/lib/sysusers.d/leptoskit-cloud.conf
          sudo systemd-sysusers /usr/lib/sysusers.d/leptoskit-cloud.conf
          sudo systemd-analyze verify "$PILOT_DIR-unpacked/systemd/leptoskit-cloud.service"

      - name: upload the candidate and acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-pilot-linux-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hosted-pilot.tar.gz
            ${{ runner.temp }}/hosted-pilot-acceptance.json
            ${{ runner.temp }}/hosted-pilot-infra.json
          retention-days: 7
          if-no-files-found: error
