name: publish

# Builds the leptoskit CLI binaries for every release target, uploads them onto the draft GitHub
# release with provenance attestations, publishes the crates to crates.io with trusted publishing,
# and only then makes the release public.
#
# The tag trigger is the entry point: monochange's release PR is merged, which creates the tag, and
# this workflow does the rest. `workflow_dispatch` exists as a retry path for a partial publish,
# because a registry that accepted some crates and then failed needs a way to finish rather than a
# new release.
#
# # Authentication
#
# Publishing prefers trusted publishing and falls back to a long-lived token. The registry is asked
# for an OIDC credential first, because that is the stronger guarantee: the credential is
# short-lived, bound to this workflow, and the registry records which run produced the package. The
# token path exists because a package has to exist in a registry before it can be enrolled with a
# trusted publisher, so the first publish of anything always uses a token.
#
# Set the `CARGO_REGISTRY_TOKEN` repository secret to enable the fallback. Leaving it unset is fine
# once every crate is enrolled: the workflow then runs the trusted path only, and fails early with a
# clear message if OIDC is unavailable.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Simulate: build and validate everything, publish nothing"
        required: false
        type: boolean
        default: false
      force_token_auth:
        description: "Skip trusted publishing and use the registry token secret"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  # A partial registry publish is worse than a queued run waiting its turn, so this never cancels.
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Validates the release before anything is built, so a malformed commit or a missing changelog
  # fails in seconds rather than after a full build.
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: extract the version from the tag
        id: version
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing version $version"

      - name: verify every manifest carries the release version
        # Publishing a crate whose version disagrees with its tag is not recoverable: crates.io will
        # not accept a corrected version at the same number.
        #
        # The versions come from cargo metadata rather than the manifests' text: every crate
        # inherits `version.workspace = true`, so only cargo knows the resolved number. Crates with
        # `publish = false` (an empty `publish` list) are not released and are skipped.
        run: |
          set -euo pipefail
          version="${STEPS_VERSION_OUTPUTS_VERSION}"
          failed=0

          packages=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | [.name, .version, .manifest_path] | @tsv')
          if [ -z "$packages" ]; then
            echo "::error::cargo metadata listed no publishable packages"
            exit 1
          fi

          while IFS=$'\t' read -r name declared manifest; do
            if [ "$declared" != "$version" ]; then
              echo "::error file=$manifest::$name is version $declared, tag says $version"
              failed=1
            fi
          done <<< "$packages"

          exit $failed
        env:
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}

      - name: verify the release ships every CLI binary
        # The upload job names the binaries it archives by hand, and `cargo binstall` resolves
        # every `[[bin]]` the CLI crate declares from that one archive. A binary added to the crate
        # but not to that list, or dropped from it, would make `cargo binstall leptoskit_cli` fail
        # against a release that looks complete, so the crate's own target list is checked against
        # the upload step here, before anything is built.
        run: |
          set -euo pipefail

          declared=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "leptoskit_cli") | .targets[] | select(.kind | index("bin")) | .name' \
            | sort)
          # The upload step's `bin:` input is the only `bin:` key in this file.
          shipped=$(grep -E '^[[:space:]]*bin:' .github/workflows/publish.yml \
            | sed -E 's/^[[:space:]]*bin:[[:space:]]*//' \
            | tr ', ' '\n\n' | sed '/^$/d' | sort)

          if [ "$declared" != "$shipped" ]; then
            echo "::error file=.github/workflows/publish.yml::the CLI declares binaries [$(tr '\n' ' ' <<< "$declared")] but the upload step ships [$(tr '\n' ' ' <<< "$shipped")]"
            exit 1
          fi
          echo "The release ships every CLI binary: $(tr '\n' ' ' <<< "$declared")"

      - name: install cargo-binstall
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-binstall

      - name: validate the release record
        run: |
          set -euo pipefail

          cargo binstall --no-confirm --disable-strategies compile monochange@0.21.0 \
            || cargo install --locked --version 0.21.0 monochange
          monochange step validate

  # The binaries users install are built here, one runner per target, and uploaded straight onto
  # the draft release that the release workflow created for the tag. A release that reached the
  # public flip without them would advertise a version with nothing to install, which is why every
  # later job waits on this one.
  upload-assets:
    name: build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      # Uploading the archives and their checksums to the draft release is this job's only write.
      contents: write
    strategy:
      # A target failing must not cancel the other seven: the per-platform log of what broke is
      # the point of the matrix.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: wait for the draft release
        # The release workflow creates the tag and the draft release before dispatching this
        # workflow, so on the normal path the draft already exists and this returns immediately.
        # The tag-push trigger has no such guarantee — nothing else creates the draft — and
        # uploading needs a release to upload to. A dry run builds without uploading, so it never
        # waits.
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for the draft release $RELEASE_TAG from the release workflow..."
          for attempt in $(seq 1 30); do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $RELEASE_TAG exists after $attempt attempt(s)."
              exit 0
            fi
            echo "  attempt $attempt/30: release not found yet; sleeping 10s"
            sleep 10
          done

          echo "::error::Release $RELEASE_TAG was not created within the wait window. Check the release workflow's release-post-merge job."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          # The verification below compares the checkout against the tag and against main, so the
          # history has to be present.
          fetch-depth: 0
          persist-credentials: false

      - name: verify the tag checkout
        # The binaries this job uploads are what users download and run, so the tree they come
        # from has to be exactly the tagged commit, and that commit has to be on main: a tag
        # pointing at an unmerged branch would ship binaries no release record describes.
        shell: bash
        run: |
          set -euo pipefail

          tag_commit="$(git rev-list -n1 "$RELEASE_TAG")"
          head_commit="$(git rev-parse HEAD)"

          if [ "$head_commit" != "$tag_commit" ]; then
            echo "::error::Checked-out commit $head_commit does not match tag $RELEASE_TAG ($tag_commit)."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$head_commit" refs/remotes/origin/main; then
            echo "::error::Tag $RELEASE_TAG ($head_commit) is not on the main branch."
            exit 1
          fi

          echo "Verified: the checkout is tag $RELEASE_TAG and it is on main."

      - uses: ./.github/actions/rust
        with:
          targets: ${{ matrix.target }}

      - name: set up the cross toolchain
        # The non-musl linux targets have no runner of their own architecture here, so their C
        # linker and libraries come from the packages this action installs.
        if: startsWith(matrix.os, 'ubuntu') && !contains(matrix.target, '-musl')
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        with:
          target: ${{ matrix.target }}

      - name: install cross
        # The musl targets build inside a container against musl rather than against the ubuntu
        # runner's glibc.
        if: contains(matrix.target, '-musl')
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cross

      - name: set static crt linkage
        # A windows binary that depends on runtime DLLs present on the build runner is not
        # runnable on a machine that lacks them, so the C runtime is linked in statically.
        if: endsWith(matrix.target, 'windows-msvc')
        shell: bash
        run: echo "RUSTFLAGS=${RUSTFLAGS:-} -C target-feature=+crt-static" >> "$GITHUB_ENV"

      - name: upload binaries
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          # Both binaries of the CLI crate, the canonical name and its `lk` alias, go into the one
          # archive named below; `cargo binstall` then extracts each by name.
          bin: leptoskit,lk
          manifest-path: crates/leptoskit_cli/Cargo.toml
          # The dist profile is the workspace's release-build profile: LTO, one codegen unit, and
          # stripped symbols.
          profile: dist
          # The action resolves the release to upload to from this ref and refuses a bare SHA, so
          # it gets the tag itself; the checkout above has already proven the tag names the commit
          # being built.
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}
          archive: leptoskit-$target-${{ env.RELEASE_TAG }}
          target: ${{ matrix.target }}
          tar: all
          zip: windows
          # A dry run builds and archives every target without touching the draft release, so the
          # exact release tree is validated.
          dry-run: ${{ inputs.dry_run == true }}
          token: ${{ secrets.GITHUB_TOKEN }}
          checksum: sha256,sha512

  # Attests the provenance of every archive the matrix just uploaded. The archives are downloaded
  # back off the draft release — rather than passed between jobs — so the attestation covers
  # exactly the artifacts users will receive. Nothing was uploaded in a dry run, so there is
  # nothing to attest.
  attest-assets:
    name: attest release assets
    needs: [validate, upload-assets]
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      # Reading the archives back off the draft release needs contents access on a draft.
      contents: write
      # Exchanging GitHub's OIDC identity for an attestation.
      id-token: write
    steps:
      - name: download the release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          asset_dir="$RUNNER_TEMP/release-asset-attestations"
          mkdir -p "$asset_dir"

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'leptoskit-*' \
            --dir "$asset_dir"

          # The pattern matching everything means the upload jobs attached no archives, and
          # attesting an empty directory would otherwise quietly pass.
          shopt -s nullglob
          archives=("$asset_dir"/*)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::error::No release archives downloaded for $RELEASE_TAG."
            exit 1
          fi

          echo "Downloaded release archives for attestation:"
          sha256sum "$asset_dir"/*

      - name: attest the release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-asset-attestations/*

      - name: verify the attestations
        # An attestation is only trustworthy once it reads back from GitHub, and it becomes
        # readable a moment after it is written, so a fresh write can transiently read as missing.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          for archive in "$RUNNER_TEMP/release-asset-attestations"/*; do
            verified=false
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"; then
                verified=true
                break
              fi
              echo "Attestation for $archive is not available yet (attempt $attempt/5)."
              sleep 10
            done
            if [ "$verified" != true ]; then
              echo "::error::Failed to verify attestation for $archive."
              exit 1
            fi
          done

  # A registry publish is not reversible, and a version whose binaries failed to build or attest
  # should not reach crates.io either: the crates would advertise an install path that is not
  # there yet. So this waits for the assets, mirroring how pina and monochange order their
  # publishes.
  publish-crates:
    name: publish crates
    needs: [validate, attest-assets]
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The registry-side trusted-publisher enrollment names this environment, so the OIDC identity
    # the job presents has to carry it: crates.io rejects a claim from a workflow that matches
    # everything except the environment.
    environment: publisher
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: ./.github/actions/rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: true

      - name: request a crates.io credential via OIDC
        id: oidc
        # A crate that is not yet enrolled with a trusted publisher makes this fail, and that is not
        # an error worth stopping for: the token fallback below covers exactly that case.
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: resolve crates.io authentication
        id: auth
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          STEPS_OIDC_OUTPUTS_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail

          force_token="${{ inputs.force_token_auth || false }}"
          oidc_token="${STEPS_OIDC_OUTPUTS_TOKEN}"

          if [ "$force_token" != "true" ] && [ -n "$oidc_token" ]; then
            echo "path=trusted" >> "$GITHUB_OUTPUT"
            echo "Using trusted publishing for crates.io."
            exit 0
          fi

          if [ -n "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "path=token" >> "$GITHUB_OUTPUT"
            echo "::notice::Using CARGO_REGISTRY_TOKEN for crates.io; at least one crate is not enrolled for trusted publishing."
            exit 0
          fi

          echo "::error::No crates.io credential: the OIDC exchange failed and CARGO_REGISTRY_TOKEN is unset."
          exit 1

      - name: publish in dependency order
        # The order matters: crates.io rejects a crate whose dependencies are not yet published, so
        # the leaves go first and the meta crate last.
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          TOKEN_SECRET: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          AUTH_PATH: ${{ steps.auth.outputs.path }}
        run: |
          set -euo pipefail

          if [ "$AUTH_PATH" = "trusted" ]; then
            export CARGO_REGISTRY_TOKEN="$OIDC_TOKEN"
          else
            export CARGO_REGISTRY_TOKEN="$TOKEN_SECRET"
          fi

          for package in \
            leptoskit_yoga \
            leptoskit_native \
            leptoskit_testing \
            leptoskit_config \
            leptoskit_plugin \
            leptoskit_codepush \
            leptoskit_wasm \
            leptoskit_axum \
            leptoskit_rpc \
            leptoskit_cli \
            leptoskit \
            leptoskit_testing_library
          do
            echo "publishing $package"

            # A retry after a partial publish finds some crates already present, which is not an
            # error: it means an earlier attempt got that far.
            if cargo publish --locked --package "$package" 2>&1 | tee publish.log; then
              echo "$package published"
            elif grep -q "already exists\|is already uploaded" publish.log; then
              echo "$package is already published; continuing"
            else
              echo "::error::Failed to publish $package"
              exit 1
            fi

            # crates.io needs a moment to make a crate available to the next publish's index lookup.
            sleep 20
          done

  # The release was created as a draft by the release workflow so a half-published release is
  # never visible. Every target's binaries are now attached and attested, and the registry has
  # accepted every crate, so this is the step that makes the release public and marks it latest.
  finalize-release:
    name: publish the github release
    needs: [validate, upload-assets, attest-assets, publish-crates]
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: flip the draft release public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release edit "$RELEASE_TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"

          echo "Release $RELEASE_TAG is public: every crate is on crates.io."
