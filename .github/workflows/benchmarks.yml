name: benchmarks

# The benchmark contract:
#
# - every pull request re-measures base and head in this same job — same
#   runner, same browser, same fixture — so the comparison never spans
#   machines or days; nothing is cached across runs except build artifacts;
# - regressions over `benchmarks/policy.json` fail the job (escape hatch:
#   the `LEPTOSKIT_ALLOW_BENCH_REGRESSIONS` repository variable) and are
#   flagged in a sticky PR comment;
# - the external comparison against React, react-native-web, Flutter web,
#   vanilla JS, and cargo-leptos is static reference data: run it on demand
#   (`workflow_dispatch`) or locally with `devenv shell -- benchmark:docs`.
#   It is never part of a pull request's verdict.

on:
  # Every pull request, whatever its base: a stacked PR is measured against the
  # layer below it, which is the change it introduces.
  pull_request:
    paths:
      - "crates/**"
      - "examples/**"
      - "benchmarks/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "devenv.nix"
      - "devenv.lock"
      - "devenv.yaml"
      - ".github/actions/devenv/**"
      - ".github/workflows/benchmarks.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# A newer push supersedes a pull request's or branch's run, so that one is
# cancelled. A run on main is never cancelled: merges come faster than the
# macOS jobs finish, and cancelling meant main never got an iOS verdict. A
# newer main push waits instead (and replaces any older waiting run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The self comparison: base (the PR's base SHA) versus head, measured back
  # to back in this job. The base checkout is a git worktree inside the
  # workspace so its build artifacts cache alongside the head build's.
  self:
    name: self comparison
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    env:
      LEPTOSKIT_ALLOW_BENCH_REGRESSIONS: ${{ vars.LEPTOSKIT_ALLOW_BENCH_REGRESSIONS }}
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup development environment
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          nix-cache: /tmp/nixcache

      - name: install the wasm target
        run: rustup target add wasm32-unknown-unknown
        shell: bash

      - name: create base worktree
        run: git worktree add --detach "$GITHUB_WORKSPACE/.bench-base" "${{ github.event.pull_request.base.sha }}"
        shell: bash

      - name: cache rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: bench-self
          workspaces: |
            .
            .bench-base
            .bench-base/benchmarks/apps/runtime/leptoskit
            benchmarks/apps/runtime/leptoskit

      - name: build the head cli
        run: cargo build --release --package leptoskit_cli --bin leptoskit
        shell: bash

      - name: build the base cli
        run: cargo build --release --package leptoskit_cli --bin leptoskit
        working-directory: .bench-base
        shell: bash

      # Each CLI builds its own revision's fixture, so a change that moves
      # the fixture with the CLI (a wasm-bindgen bump the fixture's pin must
      # follow) still compares. Both get the head's measurement glue.
      - name: build the fixture with each cli
        run: |
          set -euo pipefail
          root="$PWD"
          base_fixture="$root/.bench-base/benchmarks/apps/runtime/leptoskit"
          head_fixture="$root/benchmarks/apps/runtime/leptoskit"
          cp benchmarks/apps/runtime/shared/bench.js "$base_fixture/public/bench.js"
          cp benchmarks/apps/runtime/shared/bench.js "$head_fixture/public/bench.js"
          (cd "$base_fixture" && "$root/.bench-base/target/release/leptoskit" build --release --platform web --out dist-base)
          (cd "$head_fixture" && "$root/target/release/leptoskit" build --release --platform web --out dist-head)
          test -f "$base_fixture/dist-base/pkg/tablebench_client.js"
          test -f "$head_fixture/dist-head/pkg/tablebench_client.js"
        shell: devenv shell -- bash -e {0}

      - name: run the runtime benchmark
        run: |
          set -euo pipefail
          base_fixture="$PWD/.bench-base/benchmarks/apps/runtime/leptoskit"
          head_fixture="$PWD/benchmarks/apps/runtime/leptoskit"
          mkdir -p target/benchmarks
          deno run -A benchmarks/scripts/runtime_bench.ts \
            --app leptoskit \
            --dist "base=$base_fixture/dist-base" --dist "head=$head_fixture/dist-head" \
            --out-dir target/benchmarks
        shell: devenv shell -- bash -e {0}

      - name: run the build-speed benchmark
        run: |
          set -euo pipefail
          base_fixture="$PWD/.bench-base/benchmarks/apps/runtime/leptoskit"
          head_fixture="$PWD/benchmarks/apps/runtime/leptoskit"
          deno run -A benchmarks/scripts/build_bench.ts \
            --out target/benchmarks/build.json --scenarios warm,incremental \
            --tool "base|$base_fixture|$PWD/.bench-base/target/release/leptoskit build --release --out dist-bench-base" \
            --tool "head|$head_fixture|$PWD/target/release/leptoskit build --release --out dist-bench-head"
        shell: devenv shell -- bash -e {0}

      # The native view layer, the wasm runtime, and the QuickJS baseline on
      # this host. Both binaries are built first and then measured in
      # alternating rounds, so a drift in the runner's speed lands on both
      # sides. The base side is skipped — the comment says so — when the base
      # commit predates the bench crate.
      - name: run the native-layer benchmark
        run: |
          set -euo pipefail
          if [ -f .bench-base/benchmarks/native/Cargo.toml ]; then
            deno run -A benchmarks/scripts/native_bench.ts \
              --out target/benchmarks/head-native.json --subject head \
              --base-repo "$PWD/.bench-base" --base-out target/benchmarks/base-native.json
          else
            deno run -A benchmarks/scripts/native_bench.ts \
              --out target/benchmarks/head-native.json --subject head
          fi
        shell: devenv shell -- bash -e {0}

      - name: compare base against head
        id: compare
        run: |
          set -euo pipefail
          mkdir -p target/benchmarks
          deno run -A benchmarks/scripts/split_build_results.ts \
            --input target/benchmarks/build.json \
            --base-out target/benchmarks/base-build.json \
            --head-out target/benchmarks/head-build.json
          pair=()
          if [ -f target/benchmarks/base-native.json ]; then
            pair=(--pair "Native, wasm, and JavaScript layers (host)|target/benchmarks/base-native.json|target/benchmarks/head-native.json")
          else
            pair=(--single "Native, wasm, and JavaScript layers (host)|target/benchmarks/head-native.json")
          fi
          set +e
          deno run -A benchmarks/scripts/compare.ts \
            --base-runtime target/benchmarks/base-runtime.json \
            --head-runtime target/benchmarks/head-runtime.json \
            --base-build target/benchmarks/base-build.json \
            --head-build target/benchmarks/head-build.json \
            "${pair[@]}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --output target/benchmarks/comment.md
          status=$?
          set -e
          printf '%s\n' "$status" > target/benchmarks/compare.status
          exit 0
        shell: devenv shell -- bash -e {0}

      - name: post the benchmark comment
        if: always() && steps.compare.outcome != 'skipped' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: benchmark-results
          path: target/benchmarks/comment.md

      - name: add the report to the step summary
        if: always() && steps.compare.outcome != 'skipped'
        run: cat target/benchmarks/comment.md >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: target/benchmarks/
          retention-days: 90

      - name: enforce the regression policy
        if: always() && steps.compare.outcome != 'skipped'
        run: |
          status="$(cat target/benchmarks/compare.status)"
          if [ -z "$status" ]; then
            echo "the benchmark comparison did not finish" >&2
            exit 1
          fi
          exit "$status"
        shell: bash

  # The external comparison on demand: every vendored framework fixture plus
  # the build-speed face-off with cargo-leptos. Results upload as an artifact;
  # the committed docs tables come from a local `benchmark:docs` run, which
  # can also include Flutter web when the flutter toolchain is present.
  external:
    name: external comparison
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: setup development environment
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          nix-cache: /tmp/nixcache

      - name: install the wasm target
        run: rustup target add wasm32-unknown-unknown
        shell: bash

      - name: install cargo-leptos
        run: cargo binstall --no-confirm cargo-leptos@0.3.6 || cargo install cargo-leptos --version 0.3.6 --locked
        shell: devenv shell -- bash -e {0}

      - name: cache rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: bench-external
          workspaces: |
            .
            benchmarks/apps/runtime/leptoskit
            benchmarks/apps/build/cargo-leptos

      - name: build the leptoskit cli
        run: cargo build --release --package leptoskit_cli --bin leptoskit
        shell: bash

      - name: run the external benchmarks
        run: |
          set -euo pipefail
          mkdir -p target/benchmarks
          deno run -A benchmarks/scripts/external.ts \
            --cli "$PWD/target/release/leptoskit" \
            --runtime-out target/benchmarks/external-runtime.json \
            --build-out target/benchmarks/external-build.json \
            --skip-flutter
          deno run -A benchmarks/scripts/native_bench.ts \
            --out target/benchmarks/native-host.json --subject native-host
        shell: devenv shell -- bash -e {0}

      - name: upload external benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-benchmark-results
          path: target/benchmarks/
          retention-days: 90

  # The native, wasm, and JavaScript layers on device, on demand: the iOS
  # simulator on a macOS runner and an x86_64 Android emulator with KVM. Both
  # run the same `leptoskit_bench` binary through `leptoskit test run` and
  # upload a BenchmarkRun JSON; commit it to `benchmarks/results/` to refresh
  # the docs table. Simulators run on the host CPU — physical devices differ.
  device:
    name: device comparison (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            os: macos-latest
            targets: aarch64-apple-ios-sim,wasm32-unknown-unknown
          - platform: android
            os: ubuntu-latest
            targets: x86_64-linux-android,wasm32-unknown-unknown
    env:
      NDK_VERSION: 27.1.12297006
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: install rust
        uses: ./.github/actions/rust
        with:
          targets: ${{ matrix.targets }}

      - name: install deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: cache rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: bench-device-${{ matrix.platform }}

      - name: build the cli test runner
        run: cargo build --release --package leptoskit_cli --bin leptoskit
        shell: bash

      - name: boot the simulator and run the benchmark
        if: matrix.platform == 'ios'
        run: |
          set -euo pipefail
          mkdir -p target/benchmarks
          udid="$(xcrun simctl list devices available | grep -m1 -oE '[0-9A-F-]{36}.*\(Booted\)' | grep -oE '[0-9A-F-]{36}' || true)"
          if [ -z "$udid" ]; then
            udid="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=[d for runtime in json.load(sys.stdin)["devices"].values() for d in runtime if d["name"].startswith("iPhone")]; print(devices[-1]["udid"])')"
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
          fi
          deno run -A benchmarks/scripts/native_bench.ts \
            --platform ios --device "$udid" --cli "$PWD/target/release/leptoskit" \
            --out target/benchmarks/native-ios.json --subject native-ios
        shell: bash

      - name: install the android ndk
        if: matrix.platform == 'android'
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "ndk;${NDK_VERSION}" > /dev/null
        shell: bash

      - name: enable KVM
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
        shell: bash

      - name: run the benchmark on an android emulator
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          # Each line of `script` runs as its own command: no continuations.
          script: |
            mkdir -p target/benchmarks
            deno run -A benchmarks/scripts/native_bench.ts --platform android --device emulator-5554 --android-arch x86_64 --android-ndk "${ANDROID_HOME}/ndk/${NDK_VERSION}" --cli "$PWD/target/release/leptoskit" --out target/benchmarks/native-android.json --subject native-android

      - name: upload device benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-benchmark-${{ matrix.platform }}
          path: target/benchmarks/
          retention-days: 90
