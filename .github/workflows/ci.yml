name: ci

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: setup development environment
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          nix-cache: /tmp/nixcache

      - name: install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt
        shell: bash

      - name: lint
        run: lint:all

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: setup development environment
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          nix-cache: /tmp/nixcache

      - name: install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt
        shell: bash

      - name: build
        run: build:all

      - name: test
        run: test:cargo

      - name: test docs
        run: test:docs

      - name: chromedriver test leptos_testing_library
        run: test:browser
        shell: bash

      - name: geckodriver test leptos_testing_library
        run: GECKODRIVER=$DEVENV_PROFILE/bin/geckodriver cargo test --target wasm32-unknown-unknown --package leptos_testing_library
        shell: bash
