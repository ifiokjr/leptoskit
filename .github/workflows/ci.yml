name: ci

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  use:
    name: use coverage and portability
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: setup development environment
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          nix-cache: /tmp/nixcache

      - name: enforce complete use coverage
        run: coverage:use

      - name: check browser wasm without default features
        run: cargo check --locked --package leptoskit_use --no-default-features --target wasm32-unknown-unknown

      - name: check wasi without a browser or runtime
        run: cargo check --locked --package leptoskit_use --no-default-features --target wasm32-wasip1

  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: setup development environment
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          nix-cache: /tmp/nixcache

      - name: install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt
        shell: bash

      - name: lint
        run: lint:all

  # Ubuntu keeps the full devenv pipeline (lint lives in `checks`); the
  # other desktops run the same workspace tests through a plain rust
  # toolchain because devenv needs nix, which the hosted Windows runner does
  # not provide. The desktop platform probe — the end-to-end suite for the
  # layout, renderer, wasm runtime, and code push — runs as an ordinary test
  # on every OS in this matrix.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: install rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.96.0"

      - name: cache rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: build
        run: cargo build --workspace --all-features --locked

      - name: test
        run: cargo test --workspace --all-features

      - name: test docs
        run: cargo test --doc --workspace --all-features

  # The browser suites need the wasm target plus a webdriver; they stay on
  # the devenv pipeline where the drivers are pinned.
  browser:
    name: browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: setup development environment
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          nix-cache: /tmp/nixcache

      - name: install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt
        shell: bash

      - name: chromedriver test leptos_testing_library
        run: test:browser
        shell: bash

      - name: geckodriver test leptos_testing_library
        run: GECKODRIVER=$DEVENV_PROFILE/bin/geckodriver cargo test --target wasm32-unknown-unknown --package leptos_testing_library
        shell: bash

  # The web build pipeline end to end, on the devenv toolchain that carries
  # binaryen: the CLI's wasm tests (scaffold, SSR, precompression, the size
  # budget), then the islands example built for release with code splitting
  # and `wasm-opt`, which fails if its initial load outgrows its budget.
  wasm:
    name: wasm pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: setup development environment
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          nix-cache: /tmp/nixcache

      - name: wasm pipeline tests
        run: cargo nextest run --package leptoskit_cli --run-ignored only
        shell: bash

      - name: build the islands example for release
        working-directory: examples/islands
        run: cargo run --package leptoskit_cli -- build --release
        shell: bash

  # The iOS simulator end-to-end: the platform probe builds for
  # aarch64-apple-ios-sim, installs into a booted simulator, and every probe
  # must pass on device.
  ios:
    name: ios simulator e2e
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: install rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.96.0"
          targets: aarch64-apple-ios-sim

      - name: cache rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: run the platform probe on a simulator
        run: bash setup/scripts/ios_probe_run.sh
        shell: bash

      - name: check use primitives for ios
        run: cargo check --locked --package leptoskit_use --no-default-features --target aarch64-apple-ios-sim

  # Android end-to-end build: the platform probe cross-compiles with an NDK
  # toolchain. Hosted runners cannot run an Android emulator (no nested
  # virtualization on the standard images), so on-device execution stays on
  # developer machines via `android_emulator_run`; proving the platform
  # builds in CI is this job's contract.
  android:
    name: android build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NDK_VERSION: 27.1.12297006
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: install rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.96.0"
          targets: aarch64-linux-android

      - name: cache rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: install the android ndk
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "ndk;${NDK_VERSION}" > /dev/null

      - name: cross-compile the platform probe
        run: |
          set -euo pipefail
          linker="${ANDROID_HOME}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$linker" \
            cargo build --release --locked --package platform_probe --target aarch64-linux-android
          test -f target/aarch64-linux-android/release/platform_probe
        shell: bash

      - name: check use primitives for android
        run: cargo check --locked --package leptoskit_use --no-default-features --target aarch64-linux-android
