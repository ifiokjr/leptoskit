name: ci

on:
  push:
    branches:
      - main

  pull_request: {}

  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Every build re-checks the crates.io sparse index, and transient download
  # failures of index files failed whole jobs (config.json, rquickjs,
  # serde_core). Cargo retries spurious network errors with backoff; three
  # attempts were not enough on hosted runners.
  CARGO_NET_RETRY: 10

# A newer push supersedes a pull request's or branch's run, so that one is
# cancelled. A run on main is never cancelled: merges come faster than the
# macOS jobs finish, and cancelling meant main never got an iOS verdict. A
# newer main push waits instead (and replaces any older waiting run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  schema:
    name: configuration schemas and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: install Rust
        uses: ./.github/actions/rust

      - name: check generated schemas
        run: cargo run --quiet --locked --package leptoskit_config --features schema --example schema -- --check

      - name: test configuration contracts and migrations
        run: cargo test --locked --package leptoskit_config --all-features

  use:
    name: use coverage and portability
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: setup development environment
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          nix-cache: /tmp/nixcache

      - name: enforce complete use coverage
        run: coverage:use

      - name: enforce complete browser storage coverage
        run: coverage:use:browser

      - name: check browser wasm without default features
        run: cargo check --locked --package leptoskit_use --no-default-features --target wasm32-unknown-unknown

      # The client side of the database layer: `#[db::table]` without the
      # `server` feature, built for the browser. Nothing that talks to a
      # database may be in its dependency tree.
      - name: check database tables build for the client without server code
        run: |
          set -euo pipefail
          cargo check --locked --package leptoskit_db_client_fixture --target wasm32-unknown-unknown
          if cargo tree --locked --package leptoskit_db_client_fixture --target wasm32-unknown-unknown \
            --edges normal,no-proc-macro --prefix none | grep -E '^(sqlx|inventory|leptoskit_db_schema|regex) '; then
            echo "server-only crates reached the client build" >&2
            exit 1
          fi

      - name: lint browser storage and shared screen tests
        run: cargo clippy --locked --package leptoskit_use --features local-storage,web --lib --test web_storage --test web_storage_worker --target wasm32-unknown-unknown -- -D warnings

      - name: check wasi without a browser or runtime
        run: cargo check --locked --package leptoskit_use --all-features --lib --target wasm32-wasip1

  jni-plugins:
    name: kotlin JNI plugin bridge
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: setup development environment
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          nix-cache: /tmp/nixcache
          install-tools: "false"
      - name: test optional asynchronous host and scoped network plugins
        run: test:plugins:async
      - name: test JNI ownership and asynchronous callback lifecycle
        run: test:plugins:jni

  apple-plugins:
    name: apple plugin bridge
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: setup development environment
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          nix-cache: /tmp/nixcache
          install-tools: "false"
      - name: lint Swift
        run: lint:swift
      - name: test Apple plugin bridge and asynchronous callback lifecycle
        run: test:plugins:apple

  checks:
    name: checks
    runs-on: ubuntu-latest
    # lint:all also lints the Android and wasm builds, each a compile of its
    # own.
    timeout-minutes: 60
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: setup development environment
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          nix-cache: /tmp/nixcache

      - name: lint
        run: lint:all

      - name: test HarmonyOS render model
        run: test:harmonyos

  # Code behind a platform's cfg only compiles, and so only lints, on that
  # platform, and crates with C sources need a C compiler for it. The checks
  # job lints Linux and wasm; these runners lint Android (with the runner's
  # NDK), macOS and iOS (with Xcode), and Windows. Any warning fails the job:
  # rustc's, clippy's, and cargo's own.
  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host: false
            targets: aarch64-linux-android
          - os: macos-latest
            host: true
            targets: aarch64-apple-ios
          - os: windows-latest
            host: true
            targets: ""
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: install rust
        uses: ./.github/actions/rust
        with:
          targets: ${{ matrix.targets }}

      - name: cache rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: lint this platform
        if: matrix.host
        run: bash setup/scripts/clippy.sh
        shell: bash

      - name: lint the targets this runner also checks
        if: matrix.targets != ''
        run: bash setup/scripts/clippy.sh $TARGETS
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}

  # The offline audit of this repository's own automation: zizmor checks every
  # workflow and composite action for injection, credential persistence, action
  # pinning, and permission hardening regressions.
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: setup development environment
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          nix-cache: /tmp/nixcache
          install-tools: "false"

      - name: audit GitHub Actions workflows and composite actions
        run: security:zizmor

  # Windows and macOS run the workspace tests through a plain rust toolchain
  # because devenv needs nix, which the hosted Windows runner does not
  # provide; Linux runs the same suite instrumented in `coverage` below. The
  # desktop platform probe — the end-to-end suite for the layout, renderer,
  # wasm runtime, and code push — runs as an ordinary test on every OS.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Database drivers and real Postgres clusters make the workspace suite
    # expensive. Generated applications compile optimized host dependencies in
    # separate targets, so their builds run in the applications job below.
    # Windows takes 50 to 70 minutes with a warm build cache and needs the
    # headroom when the cache is cold, as on a new toolchain.
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # RPC generator regressions compile the generated Go clients.
      - name: install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.8"
          cache: false

      - name: install rust
        uses: ./.github/actions/rust

      - name: cache rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: build
        run: cargo build --workspace --all-features --locked

      # A panic inside a Win32 window procedure aborts the process and loses
      # libtest's captured output, so run the native suite uncaptured first.
      # Match the workspace feature graph so this check reuses the Rive C++
      # runtime instead of compiling a package-only dependency variant.
      - name: test native Windows widgets
        if: runner.os == 'Windows'
        run: cargo test --locked --workspace --all-features --test widgets -- --test-threads=1 --nocapture

      - name: test
        env:
          LEPTOSKIT_HYBRID_FIXTURE_OUTPUT: ${{ runner.temp }}/hybrid-service

        run: cargo test --locked --workspace --all-features -- --test-threads=1

      - name: run the generated hybrid service constructor
        shell: bash
        env:
          SERVICE_REGISTRANT_DIR: ${{ runner.temp }}/hybrid-service

        run: |
          set -euo pipefail
          test -s "$SERVICE_REGISTRANT_DIR/registrant.rs"
          cargo run --locked --manifest-path crates/leptoskit_cli/tests/fixtures/app-service/Cargo.toml \
            --target-dir "$PWD/target"

      - name: test docs
        run: cargo test --doc --workspace --all-features

      - name: run the portable widget journey through the test runner
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p leptoskit_testing --example widget_suite
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          cargo run --locked -p leptoskit_cli --bin leptoskit -- test run \
            --binary "target/debug/examples/widget_suite$suffix"

      # target/tmp/gallery-snapshot holds every gallery screen as captured by the
      # test step; gallery's tests/cli.rs fails it when one is missing or blank.
      - name: retain desktop test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testing-${{ matrix.os }}
          path: |
            target/leptoskit-tests
            target/native-widgets
            target/tmp/gallery-snapshot
          if-no-files-found: ignore

  # Generated hosts each keep their own build target. Run these cold builds
  # separately from the workspace suite so neither workload consumes the
  # other's execution budget.
  applications:
    name: applications (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: install rust
        uses: ./.github/actions/rust

      - name: cache rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: build
        run: cargo build --workspace --all-features --locked

      - name: build generated macOS application
        if: runner.os == 'macOS'
        shell: bash

        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          sdk="$PWD"
          cli="$PWD/target/debug/leptoskit"

          # Generated apps live outside target/, which rust-cache restores: a
          # restored copy would make `new` refuse the destination.
          "$cli" new "$RUNNER_TEMP/macos-app" --name macos_app --sdk-path "$sdk"
          cd "$RUNNER_TEMP/macos-app"
          "$cli" native build macos
          test -x .leptoskit/macos/App.app/Contents/MacOS/App
          test -s .leptoskit/macos/App.app/Contents/Resources/app.wasm
          plutil -lint .leptoskit/macos/App.app/Contents/Info.plist

      # Commonplace is a standalone workspace in the scaffold's shape, like
      # file_routes: its API and screens are tested here, its migrations
      # checked against its tables, and its website and macOS app built
      # through the CLI.
      - name: test and build the commonplace example
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cli="$PWD/target/debug/leptoskit"
          cd examples/commonplace
          cargo test --locked --package commonplace_shared --package commonplace_backend --package commonplace_app
          "$cli" db check
          "$cli" build
          test -s dist/pkg/commonplace_app_bg.wasm
          "$cli" native build macos
          test -s .leptoskit/macos/App.app/Contents/Resources/app.wasm

      # Safari installs extensions only from inside an app, so Commonplace's
      # macOS app carries its Safari extension, sandboxed as Safari requires.
      - name: check commonplace's Safari extension
        if: runner.os == 'macOS'
        shell: bash
        working-directory: examples/commonplace/.leptoskit/macos/App.app
        run: |
          set -euo pipefail
          appex=Contents/PlugIns/SafariExtension.appex
          test -s "$appex/Contents/Resources/manifest.json"
          test -x "$appex/Contents/MacOS/SafariExtension"
          plutil -lint "$appex/Contents/Info.plist"
          codesign --verify --strict --deep .
          codesign -d --entitlements - "$appex" 2>&1 | grep -q com.apple.security.app-sandbox

      # `leptoskit test extension` loads the extension into Chrome for
      # Testing and checks every page, the worker, and each content script on
      # a page with a strict content security policy: Commonplace's, and a
      # freshly scaffolded one's.
      - name: test the extensions in Chrome for Testing
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cli="$PWD/target/debug/leptoskit"
          sdk="$PWD"
          npx --yes @puppeteer/browsers@2 install chrome@stable chromedriver@stable --path "$HOME/.cache/puppeteer"
          (cd examples/commonplace && "$cli" test extension)
          "$cli" new "$RUNNER_TEMP/extension-app" --name extension_app --extension --sdk-path "$sdk"
          cd "$RUNNER_TEMP/extension-app"
          "$cli" test extension

      # The dry run builds a release extension, and release builds optimize
      # with wasm-opt; pin the binaryen release the release job uses.
      - name: install binaryen
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/binaryen.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-arm64-macos.tar.gz" \
            -o "$archive"
          echo "98aad827847af7ef990ed7098d885725c8e5b5aae75073403635617ae4e259aa  $archive" | shasum --algorithm 256 --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_132/bin" >> "$GITHUB_PATH"

      # Every store's checks and remaining steps, on a real extension, with no
      # credentials and no store contacted.
      - name: dry-run publishing commonplace
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cli="$PWD/target/debug/leptoskit"
          cd examples/commonplace
          "$cli" publish --dry-run
          test -s .leptoskit/publish/next-steps.json
          test -s .leptoskit/extension/firefox-source.zip

      - name: build generated Windows application
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          sdk="$PWD"
          cli="$PWD/target/debug/leptoskit.exe"
          "$cli" new "$RUNNER_TEMP/windows-app" --name windows_app --sdk-path "$sdk"
          cd "$RUNNER_TEMP/windows-app"
          "$cli" native build windows
          test -s .leptoskit/windows/app/windows_app.exe
          test -s .leptoskit/windows/app/assets/app.wasm

      # The file-routes example is a standalone workspace in the scaffold's
      # shape; build it through the same pipeline as a generated app.
      - name: build the file routes example for this desktop
        shell: bash
        run: |
          set -euo pipefail
          cli="$PWD/target/debug/leptoskit"
          if [ "$RUNNER_OS" = "Windows" ]; then cli="$cli.exe"; target=windows; else target=macos; fi
          cd examples/file_routes
          "$cli" native build "$target"

  # The Linux leg of the desktop suite, instrumented: the workspace tests, the
  # GTK widget suite under Xvfb, the doc tests, and the portable widget
  # journey run once with `-C instrument-coverage`, so the integration runs
  # count toward coverage alongside the unit tests. A second matrix leg runs
  # the CLI's wasm end-to-end tests and application builds with the same
  # instrumentation. Both reports reach the coverage gate, and the cold
  # application builds do not consume the workspace tests' execution budget.
  coverage:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: workspace
            name: coverage (ubuntu-latest)
          - suite: applications
            name: application coverage (ubuntu-latest)
    env:
      LLVM_COV_ENV: ${{ github.workspace }}/target/llvm-cov.env
      BINARYEN_VERSION: "132"
      BINARYEN_SHA256: 195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572
      # The instrumented `leptoskit_cli` test binaries are large. Linking all
      # of them at once on a four-core runner has killed `ld` with SIGBUS, so
      # build and link two at a time; the job has the time budget for it.
      CARGO_BUILD_JOBS: 2
    steps:
      # The instrumented workspace, its test binaries, and the release builds
      # below outgrow the runner's free disk, which fails the job or stalls it
      # until it times out. Drop toolchains this job never uses.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The patch gate diffs against the merge base with the base branch.
          fetch-depth: 0
          persist-credentials: false

      - name: install rust
        uses: ./.github/actions/rust

      - name: cache rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.suite }}

      - name: install cargo-llvm-cov
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          # Keep in step with `[workspace.metadata.bin]` in Cargo.toml.
          tool: cargo-llvm-cov@0.9.1

      - name: install Linux native widget dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev pkg-config xvfb dbus-x11 at-spi2-core fonts-dejavu-core xdotool

      # Release builds optimize with `wasm-opt`; this is the binaryen release
      # devenv provides.
      - name: install binaryen
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/binaryen.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            -o "$archive"
          echo "${BINARYEN_SHA256}  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      # The exported values are shell-quoted, so each instrumented step sources
      # them rather than reading them through $GITHUB_ENV.
      - name: instrument the builds in this job
        shell: bash
        run: |
          set -euo pipefail
          cargo-llvm-cov llvm-cov clean --workspace
          # Instrument host builds only. Tests that run the CLI start nested
          # cargo builds for wasm32, which has no profiler runtime and would
          # fail to link instrumented code.
          cargo-llvm-cov llvm-cov show-env --sh --coverage-host-only > "$LLVM_COV_ENV"

      - name: build
        shell: bash
        run: |
          # shellcheck source=/dev/null
          source "$LLVM_COV_ENV"
          cargo build --workspace --all-features --locked

      - name: test
        if: matrix.suite == 'workspace'
        shell: bash
        env:
          # The database migration tests apply real migrations to a
          # throwaway cluster from the runner's preinstalled Postgres.
          LEPTOSKIT_REQUIRE_POSTGRES: "1"
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "$LLVM_COV_ENV"
          dbus-run-session -- xvfb-run -a env GDK_BACKEND=x11 GSK_RENDERER=cairo \
            cargo test --locked --workspace --all-features -- --test-threads=1

      - name: reject Rive widgets when the host feature is disabled
        if: matrix.suite == 'workspace'
        shell: bash
        run: |
          # shellcheck source=/dev/null
          source "$LLVM_COV_ENV"
          cargo test --locked --package leptoskit_native --no-default-features --test controls

      - name: test docs
        if: matrix.suite == 'workspace'
        shell: bash
        run: |
          # shellcheck source=/dev/null
          source "$LLVM_COV_ENV"
          cargo test --doc --workspace --all-features

      - name: run the portable widget journey through the test runner
        if: matrix.suite == 'workspace'
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "$LLVM_COV_ENV"
          cargo build --locked -p leptoskit_testing --example widget_suite
          cargo run --locked -p leptoskit_cli --bin leptoskit -- test run \
            --binary target/debug/examples/widget_suite

      # The ignored tests of the CLI's end-to-end targets compile real projects
      # for wasm32: a fresh scaffold built against this repository, SSR with
      # each side's feature, the compile-and-bind pipeline and its cache, and
      # release builds that precompress, report, and fail over their budget.
      # They are the only ignored tests in those targets, so `--ignored`
      # selects exactly them.
      - name: run the wasm end-to-end tests
        if: matrix.suite == 'applications'
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "$LLVM_COV_ENV"
          cargo test --locked --package leptoskit_cli --test cli --test render --test wasm_pipeline --test universal --test size --test split --test native_split --test db -- --ignored

      - name: build generated Linux application
        if: matrix.suite == 'applications'
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "$LLVM_COV_ENV"
          sdk="$PWD"
          cli="$PWD/target/debug/leptoskit"
          "$cli" new "$RUNNER_TEMP/linux-app" --name linux_app --sdk-path "$sdk"
          cd "$RUNNER_TEMP/linux-app"
          env -u RUSTFLAGS "$cli" native build linux
          test -x .leptoskit/linux/app/linux_app
          test -s .leptoskit/linux/app/assets/app.wasm

      - name: build generated terminal application
        if: matrix.suite == 'applications'
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "$LLVM_COV_ENV"
          sdk="$PWD"
          cli="$PWD/target/debug/leptoskit"
          "$cli" new "$RUNNER_TEMP/tui-app" --name tui_app --sdk-path "$sdk" --platform tui
          cd "$RUNNER_TEMP/tui-app"
          env -u RUSTFLAGS "$cli" native build tui
          test -x .leptoskit/tui/app/tui_app
          test -s .leptoskit/tui/app/assets/app.wasm

      - name: build the opencode example for the browser and the terminal
        if: matrix.suite == 'applications'
        shell: bash
        working-directory: examples/opencode
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "$LLVM_COV_ENV"
          cli="$GITHUB_WORKSPACE/target/debug/leptoskit"
          "$cli" routes --check
          "$cli" build
          test -s dist/pkg/opencode_example_bg.wasm
          env -u RUSTFLAGS "$cli" build --platform tui
          test -x .leptoskit/tui/app/opencode
          test -s .leptoskit/tui/app/assets/app.wasm

      - name: build the islands example for release
        if: matrix.suite == 'applications'
        shell: bash
        working-directory: examples/islands
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "$LLVM_COV_ENV"
          cargo run --locked --package leptoskit_cli --bin leptoskit -- build --release

      - name: build the file routes example for linux
        if: matrix.suite == 'applications'
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "$LLVM_COV_ENV"
          cli="$PWD/target/debug/leptoskit"
          cd examples/file_routes
          env -u RUSTFLAGS "$cli" native build linux

      - name: export the coverage report
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source "$LLVM_COV_ENV"
          mkdir -p target/coverage
          # The default filter also drops every path containing tests/,
          # examples/, or benches/, which would hide the example apps.
          # coverage_gate decides what counts; this only drops the toolchain
          # and dependency sources.
          cargo-llvm-cov llvm-cov report --lcov --output-path target/coverage/lcov.info \
            --no-default-ignore-filename-regex \
            --ignore-filename-regex '(\.cargo/(registry|git)/|/rustc/|\.rustup/)'

      - name: hand the report to the coverage gate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-linux-${{ matrix.suite }}
          path: target/coverage/lcov.info
          if-no-files-found: error

      - name: retain coverage and desktop test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testing-ubuntu-latest-${{ matrix.suite }}
          path: |
            target/coverage/lcov.info
            target/leptoskit-tests
            target/native-widgets
            target/tmp/gallery-snapshot
          if-no-files-found: ignore

  # The browser suites need the wasm target plus a webdriver; they stay on
  # the devenv pipeline where the drivers are pinned.
  browser:
    name: browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: setup development environment
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          nix-cache: /tmp/nixcache

      # file_routes is its own workspace, so its wasm-bindgen tools install
      # under it; cargo-run-bin ignores a failed install, so verify the binary
      # landed instead of surfacing "Process failed to start" mid-suite.
      - name: install the file routes example's pinned binaries
        run: |
          set -euo pipefail
          cd examples/file_routes
          cargo bin --install
          rust_version="$(rustc --version | cut -d' ' -f2)"
          # cargo-run-bin files every nightly under one `rust-nightly` directory.
          case "$rust_version" in *-nightly | *-dev) rust_version=nightly ;; esac
          test -x ".bin/rust-$rust_version/wasm-bindgen-cli/0.2.129/bin/wasm-bindgen-test-runner"
        shell: bash

      - name: lint Rive browser bindings
        run: cargo clippy --locked --package leptoskit_rive --package leptoskit_native --all-features --lib --tests --target wasm32-unknown-unknown -- -D warnings

      - name: check Rive descriptions in WASI guests
        run: >-
          cargo check --locked --package leptoskit_rive --package leptoskit_native
          --features leptoskit_rive/serde,leptoskit_rive/native,leptoskit_native/rive,leptoskit_native/serde
          --target wasm32-wasip1 --lib

      - name: chromedriver browser suites
        run: test:browser
        shell: bash

      - name: test compiled plugin guest
        run: test:plugins:guest
        shell: bash

      - name: verify interpreter guest feature isolation and default allocations
        run: test:plugins:guest-isolation
        shell: bash

      - name: test browser plugins
        run: test:plugins:browser
        shell: bash

      - name: geckodriver browser suites
        run: |
          GECKODRIVER=$DEVENV_PROFILE/bin/geckodriver cargo test --target wasm32-unknown-unknown --package leptoskit_testing_library
          GECKODRIVER=$DEVENV_PROFILE/bin/geckodriver cargo test --target wasm32-unknown-unknown --package leptoskit_query
          GECKODRIVER=$DEVENV_PROFILE/bin/geckodriver cargo test --target wasm32-unknown-unknown --package leptoskit_native --features web --test web_browser
          GECKODRIVER=$DEVENV_PROFILE/bin/geckodriver cargo test --target wasm32-unknown-unknown --package leptoskit_use --features local-storage --test web_storage --test web_storage_worker
          GECKODRIVER=$DEVENV_PROFILE/bin/geckodriver cargo test --target wasm32-unknown-unknown --package leptoskit_rive --features web --test browser
          GECKODRIVER=$DEVENV_PROFILE/bin/geckodriver cargo test --target wasm32-unknown-unknown --package leptoskit_native --features web,rive --test web_rive
        shell: bash

      - name: run browser tests through the test runner
        run: cargo run --locked -p leptoskit_cli --bin leptoskit -- test web --browser chrome

      # The Chrome suites again, instrumented with the pinned nightly, so code
      # that only runs in a browser counts toward the coverage gate.
      - name: measure browser coverage
        run: coverage:browser
        shell: bash

      - name: hand the browser coverage to the coverage gate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-browser
          path: target/coverage/browser/lcov.info
          if-no-files-found: error

      - name: retain browser test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testing-browser
          path: target/leptoskit-tests
          if-no-files-found: ignore

  # The `nightly` cargo feature forwards to leptos's, which is opt-in even on
  # the pinned nightly toolchain; this job proves it compiles through every
  # crate that offers it.
  nightly:
    name: nightly feature
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: cache rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: check the crates that forward it
        run: |
          set -euo pipefail
          cargo check --locked --package leptoskit_rpc --features nightly
          cargo check --locked --package leptoskit_query --features nightly
          cargo check --locked --package leptoskit --features nightly,leptos
        shell: bash

  # The iOS simulator end-to-end: the platform probe builds for
  # aarch64-apple-ios-sim, installs into a booted simulator, and every probe
  # must pass on device.
  ios:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    # Each application has an isolated native target. Keep its cold builds
    # separate from widget verification and the code push milestone.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: widgets
            name: ios simulator e2e
          - suite: applications
            name: ios applications e2e
          - suite: codepush
            name: ios code push e2e
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # One simulator serves every step. Creating a fresh device per verifier
      # cost minutes of first boot each, and tipped slow runners over the
      # timeout; this one boots in the background while the job compiles.
      - name: start the job's simulator
        shell: bash
        run: |
          set -euo pipefail
          read -r runtime device_type < <(xcrun simctl list runtimes available --json | jq -er '
            [.runtimes[] | select(.platform == "iOS")]
            | sort_by(.version | split(".") | map(tonumber)) | last
            | "\(.identifier) \([.supportedDeviceTypes[] | select(.name | test("^iPhone [0-9]+$"))]
              | sort_by(.name | ltrimstr("iPhone ") | tonumber) | last | .identifier)"')
          udid="$(xcrun simctl create "Leptoskit CI" "$device_type" "$runtime")"
          xcrun simctl boot "$udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: install rust
        uses: ./.github/actions/rust
        with:
          targets: aarch64-apple-ios-sim

      - name: cache rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.suite }}

      - name: wait for the application's simulator
        if: matrix.suite != 'widgets'
        shell: bash
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: test the iOS probe build environment
        if: matrix.suite == 'widgets'
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition 2024 -D warnings --test setup/scripts/tests/ios_probe_environment.rs -o "$RUNNER_TEMP/ios-probe-environment-tests"
          "$RUNNER_TEMP/ios-probe-environment-tests"

      - name: run the platform probe on a simulator
        if: matrix.suite == 'widgets'
        shell: bash
        run: |
          set -euo pipefail
          # The probe script runs on the booted simulator; wait for it here.
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          bash setup/scripts/ios_probe_run.sh

      - name: check use primitives for ios
        if: matrix.suite == 'widgets'
        run: cargo check --locked --package leptoskit_use --all-features --lib --target aarch64-apple-ios-sim

      - name: exercise application lifecycle and initial errors with UIKit
        if: matrix.suite == 'widgets'
        shell: bash
        run: |
          set -euo pipefail
          controls=crates/leptoskit_bridge_ffi/ios-controls
          bash "$controls/build.sh" "$RUNNER_TEMP/ios-application-controls"
          bash "$controls/run.sh" "$SIMULATOR_UDID" \
            "$RUNNER_TEMP/ios-application-controls/Controls.app" \
            "$RUNNER_TEMP/ios-application-controls-receipt"

      - name: retain application UIKit control results
        if: always() && matrix.suite == 'widgets'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-application-controls
          path: ${{ runner.temp }}/ios-application-controls-receipt
          if-no-files-found: ignore

      - name: run the widget journey on the simulator
        if: matrix.suite == 'widgets'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p leptoskit_testing --example widget_suite --target aarch64-apple-ios-sim
          cargo run --locked -p leptoskit_cli --bin leptoskit -- test run --platform ios --device "$SIMULATOR_UDID" \
            --binary target/aarch64-apple-ios-sim/debug/examples/widget_suite

      # Renders every shared primitive with real UIKit views in a signed
      # UIApplication on the job's simulator, failing on any native assertion.
      # The probe is instrumented, and its profile becomes this platform's
      # coverage report.
      - name: render shared primitives with UIKit
        if: matrix.suite == 'widgets'
        run: |
          cargo run --locked -p leptoskit_uikit --example verify_simulator -- --coverage \
            --device "$SIMULATOR_UDID" --output "$PWD/target/native-widgets/ios"
          bash setup/scripts/export_device_coverage.sh target/native-widgets/ios/uikit.profraw \
            target/native-widgets/ios/LeptoskitUIKitProbe.app/native_probe target/coverage/ios/lcov.info

      - name: hand the UIKit coverage to the coverage gate
        if: matrix.suite == 'widgets'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-ios
          path: target/coverage/ios/lcov.info
          if-no-files-found: error

      # Launches every gallery screen in a UIKit app; each must report VERIFIED.
      - name: render the gallery with UIKit
        if: matrix.suite == 'widgets'
        run: |
          cargo run --locked -p gallery_verify --example verify_mobile -- ios \
            --device "$SIMULATOR_UDID" --output "$PWD/target/gallery/ios"

      - name: retain simulator test reports
        if: always() && matrix.suite == 'widgets'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testing-ios
          path: |
            target/leptoskit-tests
            target/native-widgets
            target/gallery/ios/*.png
            target/gallery/ios/*.txt
          if-no-files-found: ignore

      - name: build and test generated iOS application
        if: matrix.suite == 'applications'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p leptoskit_cli --bin leptoskit
          # Generated apps live outside target/, which rust-cache restores.
          target/debug/leptoskit new "$RUNNER_TEMP/mobile-app" --sdk-path "$PWD"
          cli="$PWD/target/debug/leptoskit"
          cd "$RUNNER_TEMP/mobile-app"
          "$cli" native prepare ios-simulator
          xcodebuild -project .leptoskit/ios/Host.xcodeproj -scheme App -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath .leptoskit/ios/build \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- ARCHS=arm64 test

      - name: retain generated iOS application test reports
        if: always() && matrix.suite == 'applications'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-app-ios
          path: ${{ runner.temp }}/mobile-app/.leptoskit/ios/build/Logs/Test
          if-no-files-found: ignore

      # The file-routes example through the whole standard pipeline: generated
      # routes are current, the app builds for the simulator, launches, and
      # its router screens mount and navigate inside the interpreter.
      - name: build, launch, and drive the file routes example
        if: matrix.suite == 'applications'
        shell: bash
        run: |
          set -euo pipefail
          cli="$PWD/target/debug/leptoskit"
          cd examples/file_routes
          "$cli" plugin:router routes --check
          "$cli" native build ios-simulator
          app=".leptoskit/ios/build/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl install "$SIMULATOR_UDID" "$app"
          xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" dev.leptoskit.field
          sleep 5
          xcrun simctl io "$SIMULATOR_UDID" screenshot field-ios.png
          test -s field-ios.png
          xcrun simctl terminate "$SIMULATOR_UDID" dev.leptoskit.field || true
          cargo test --manifest-path Cargo.toml --locked --test guest

      - name: retain the file routes simulator evidence
        if: always() && matrix.suite == 'applications'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: examples-ios
          path: examples/file_routes/field-ios.png
          if-no-files-found: ignore

      # Scaffold an app, then render from Wasm, download, verify and activate a
      # signed replacement, relaunch offline, and recover from a trapping guest.
      - name: run the mobile code push milestone on the simulator
        if: matrix.suite == 'codepush'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p leptoskit_cli --bin leptoskit --example mobile_codepush
          # Keep milestone Rust outputs inside this job's temporary directory.
          CARGO_TARGET_DIR="$RUNNER_TEMP/mobile-app/target" target/debug/examples/mobile_codepush --platform ios --device "$SIMULATOR_UDID" \
            --sdk-path "$PWD" --cli "$PWD/target/debug/leptoskit" --output "$RUNNER_TEMP/mobile-codepush-ios"

      - name: retain mobile code push milestone evidence
        if: always() && matrix.suite == 'codepush'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-codepush-ios
          path: |
            ${{ runner.temp }}/mobile-codepush-ios/*.log
            ${{ runner.temp }}/mobile-codepush-ios/milestone.xcresult
          if-no-files-found: ignore

  # Cross-compile the shared stack for ARM64 and execute the portable widget
  # journey on an x86_64 emulator using the hosted Linux runner's KVM.
  android:
    name: android build and widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NDK_VERSION: 27.1.12297006
      KOTLIN_VERSION: 2.1.21
      KOTLIN_SHA256: 1ba08a8b45da99339a0601134cc037b54cf85e9bc0edbe76dcbd27c2d684a977
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: install rust
        uses: ./.github/actions/rust
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: cache rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Installs everything the emulator step needs too, with retries, so
      # android-emulator-runner's own unretried sdkmanager install finds each
      # package current and downloads nothing.
      - name: install the android sdk packages
        run: |
          set -euo pipefail
          bash setup/scripts/android_sdk_install.sh "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;36.0.0" \
            emulator "system-images;android-35;default;x86_64" "build-tools;37.0.0" platform-tools

      - name: install the kotlin compiler
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kotlin-compiler.zip"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" \
            -o "$archive"
          echo "${KOTLIN_SHA256}  $archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"

      - name: cross-compile the platform probe
        run: |
          set -euo pipefail
          linker="${ANDROID_HOME}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$linker" \
            cargo build --release --locked --package platform_probe --package leptoskit_bridge_ffi --target aarch64-linux-android
          test -f target/aarch64-linux-android/release/platform_probe
          "${linker}++" -std=c++20 -Wall -Wextra -Werror -shared -fPIC \
            crates/leptoskit_bridge_ffi/android/bridge.cpp \
            target/aarch64-linux-android/release/libleptoskit_bridge_ffi.a \
            -llog -landroid -ldl \
            -o target/aarch64-linux-android/release/libleptoskit_bridge_jni.so
        shell: bash

      - name: check use primitives for android
        run: cargo check --locked --package leptoskit_use --all-features --lib --target aarch64-linux-android

      - name: build the widget journey and host test runner
        shell: bash
        run: |
          set -euo pipefail
          linker="${ANDROID_HOME}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$linker" \
            cargo build --locked -p leptoskit_testing --example widget_suite --target x86_64-linux-android
          cargo build --locked -p leptoskit_cli --bin leptoskit --example mobile_codepush
          cargo build --locked -p leptoskit_android --example verify_device
          cargo build --locked -p gallery_verify --example verify_mobile

      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: prepare generated Android application
        shell: bash
        run: |
          set -euo pipefail
          # Generated apps live outside target/, which rust-cache restores.
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          cargo run --locked -p leptoskit_cli --example native_plugin_suite -- \
            --cli target/debug/leptoskit --destination "$RUNNER_TEMP/mobile-app" --target android-x86_64

      - name: prepare universal Android application
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          cli="$PWD/target/debug/leptoskit"
          "$cli" new "$RUNNER_TEMP/universal-android" --sdk-path "$PWD"
          cd "$RUNNER_TEMP/universal-android"
          "$cli" native prepare android-x86_64

      # The file-routes example as a release APK, built before the emulator
      # boots so the device step only installs and launches it. It is the one
      # app CI runs through R8, which strips the Kotlin the JNI library calls
      # by name unless the generated keep rules cover it; such an app builds
      # and then crashes at launch. Gradle leaves release APKs unsigned, so a
      # throwaway key signs it for the emulator.
      - name: build the file routes example app
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          cli="$PWD/target/debug/leptoskit"
          build_tools="${ANDROID_HOME}/build-tools/36.0.0"
          cd examples/file_routes
          "$cli" native build android-x86_64 --release
          "$build_tools/zipalign" -f -p 16 android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/field-aligned.apk"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/field.jks" -storepass android -keypass android \
            -alias field -keyalg RSA -validity 1 -dname CN=field
          "$build_tools/apksigner" sign --ks "$RUNNER_TEMP/field.jks" --ks-pass pass:android \
            --out "$RUNNER_TEMP/field-release.apk" "$RUNNER_TEMP/field-aligned.apk"

      - name: run the widget journey on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          # The first command waits until the freshly booted emulator's adb
          # transport holds. The third renders every shared primitive with
          # real Android Views in an Activity and fails unless it reports
          # VERIFIED; the fourth does the same for every gallery screen.
          script: |
            bash setup/scripts/android_settle.sh emulator-5554
            target/debug/leptoskit test run --platform android --device emulator-5554 --binary target/x86_64-linux-android/debug/examples/widget_suite
            ANDROID_SERIAL=emulator-5554 ANDROID_ABI=x86_64 JAVA_HOME="$JAVA_HOME_17_X64" LEPTOSKIT_ANDROID_ARTIFACTS="$PWD/target/native-widgets/android" cargo run --locked -p leptoskit_android --example verify_device -- --coverage
            ANDROID_SERIAL=emulator-5554 ANDROID_ABI=x86_64 JAVA_HOME="$JAVA_HOME_17_X64" target/debug/examples/verify_mobile android --output "$PWD/target/gallery/android"
            adb -s emulator-5554 install -r "$RUNNER_TEMP/field-release.apk"
            adb -s emulator-5554 shell am start -W -n dev.leptoskit.field/dev.leptoskit.field.MainActivity
            sleep 5 && adb -s emulator-5554 shell pidof dev.leptoskit.field | grep -q .
            adb -s emulator-5554 exec-out screencap -p > "$GITHUB_WORKSPACE/examples/file_routes/field-android.png"
            test -s "$GITHUB_WORKSPACE/examples/file_routes/field-android.png"
            cd "$RUNNER_TEMP/mobile-app/android" && ./gradlew --no-daemon connectedDebugAndroidTest
            cd "$RUNNER_TEMP/universal-android/android" && ./gradlew --no-daemon connectedDebugAndroidTest
            cd "$GITHUB_WORKSPACE" && CARGO_TARGET_DIR="$RUNNER_TEMP/mobile-app/target" ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" target/debug/examples/mobile_codepush --platform android --device emulator-5554 --android-target android-x86_64 --sdk-path "$GITHUB_WORKSPACE" --cli "$GITHUB_WORKSPACE/target/debug/leptoskit" --output "$RUNNER_TEMP/mobile-codepush-android"

      - name: retain the file routes emulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: examples-android
          path: examples/file_routes/field-android.png
          if-no-files-found: ignore

      - name: export the Android coverage
        shell: bash
        run: |
          bash setup/scripts/export_device_coverage.sh target/native-widgets/android/coverage.profraw \
            target/native-widgets/android/lib/x86_64/libleptoskit_android.so target/coverage/android/lcov.info

      - name: hand the Android coverage to the coverage gate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-android
          path: target/coverage/android/lcov.info
          if-no-files-found: error

      - name: retain Android test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testing-android
          path: |
            target/leptoskit-tests
            ${{ runner.temp }}/mobile-app/android/app/build/reports/androidTests
            ${{ runner.temp }}/mobile-app/android/app/build/outputs/androidTest-results
            ${{ runner.temp }}/universal-android/android/app/build/reports/androidTests
            ${{ runner.temp }}/universal-android/android/app/build/outputs/androidTest-results
            ${{ runner.temp }}/mobile-codepush-android/*.log
            ${{ runner.temp }}/mobile-codepush-android/screenshots
            target/native-widgets
            target/gallery/android/*.png
            target/gallery/android/*.txt
          if-no-files-found: ignore

  # Coverage is measured on four platforms: the Linux suite, the Chrome
  # suites, the UIKit verifier on an iOS simulator, and the Android verifier
  # on an emulator.
  # Their reports are merged, so a line counts as covered when any platform
  # ran it, and the merged result is held to the floor in
  # setup/coverage_gate/floor.txt and, on a pull request, the lines it adds to
  # the patch minimum.
  coverage-gate:
    name: coverage gate
    needs:
      - coverage
      - browser
      - ios
      - android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The patch gate diffs against the merge base with the base branch.
          fetch-depth: 0
          persist-credentials: false

      - name: install rust
        uses: ./.github/actions/rust

      - name: collect the platform reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: target/coverage

      - name: enforce the coverage floor and patch coverage
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          args=(--floor setup/coverage_gate/floor.txt --markdown "$GITHUB_STEP_SUMMARY" --annotate \
            --exclude-from setup/coverage_gate/exclusions.txt)
          for platform in linux-workspace linux-applications browser ios android; do
            args+=(--lcov "target/coverage/coverage-$platform/lcov.info")
          done
          # A pull request is checked out as GitHub's merge commit, whose first
          # parent is the base the reports were measured against: the parent
          # layer for a stacked PR. The event's `base.sha` can be older than
          # that parent, which would count every commit merged into the base
          # since then as this PR's change. A dispatched run on a branch (the
          # release PR) diffs against main; main itself is held to the floor
          # only.
          if [ "$EVENT_NAME" = pull_request ]; then
            args+=(--base HEAD^1)
          elif [ "$GITHUB_REF_NAME" != main ]; then
            args+=(--base origin/main)
          fi
          cargo run --locked --quiet -p coverage_gate -- "${args[@]}"
