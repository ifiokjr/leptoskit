[book]
authors = ["Ifiok Jr."]
description = "Shared Rust screens, built-in Tailwind, Leptos web rendering, and native AppKit widgets with code push."
language = "en"
src = "src"
title = "leptoskit"

[output.html]
additional-css = ["theme/leptoskit.css"]
default-theme = "light"
edit-url-template = "https://github.com/ifiokjr/leptoskit/edit/main/docs/{path}"
git-repository-url = "https://github.com/ifiokjr/leptoskit"
preferred-dark-theme = "navy"
site-url = "/leptoskit/"

# Examples use leptoskit crates, which the Rust Playground does not have.
[output.html.playground]
runnable = false
