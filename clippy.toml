allow-indexing-slicing-in-tests = true
suppress-restriction-lint-in-const = true
# Proper nouns that read wrong in backticks; ".." keeps the defaults.
doc-valid-idents = [
	"AppKit",
	"UIKit",
	"HarmonyOS",
	"ArkUI",
	"ArkTS",
	"DevEco",
	"OpenAPI",
	"TypeScript",
	"JavaScript",
	"WebAssembly",
	"PyPI",
	"npm",
	"PostgreSQL",
	"PostGIS",
	"GeoPackage",
	"GeoJSON",
	"GiST",
	"SQLite",
	"UUIDv5",
	"UUIDv7",
	"WebAuthn",
	"OAuth",
	"GitHub",
	"OpenID",
	"..",
]

# Readability floors: a function a reader can hold in their head. Each
# threshold pairs with a lint the workspace turns on in `Cargo.toml`.
cognitive-complexity-threshold = 25
excessive-nesting-threshold = 6
too-many-lines-threshold = 150
