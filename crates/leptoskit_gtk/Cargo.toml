[package]
name = "leptoskit_gtk"
version = "0.1.1"
authors.workspace = true
categories = ["gui", "rendering"]
edition.workspace = true
homepage.workspace = true
keywords = ["gtk", "linux", "native", "renderer", "leptos"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "The leptoskit GTK4 widget backend for Linux."

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
leptoskit_native = { workspace = true }
leptoskit_yoga = { workspace = true }
gtk = { package = "gtk4", version = "0.9", features = ["v4_6"] }
pangocairo = "0.20"

[dev-dependencies]
libtest-mimic = { workspace = true }

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dev-dependencies]
leptoskit_native = { workspace = true, features = ["rive"] }
leptoskit_rive = { workspace = true }

[[test]]
name = "widgets"
harness = false

[lints]
workspace = true
