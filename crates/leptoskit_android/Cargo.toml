[package]
name = "leptoskit_android"
version = "0.1.1"
authors.workspace = true
categories = ["gui", "os", "rendering"]
edition.workspace = true
homepage.workspace = true
keywords = ["android", "native", "renderer", "leptos"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Android Views backend for the leptoskit shared native component tree."

[package.metadata.leptoskit.native-support]
android = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
probe = []
# Lets the probe flush its LLVM coverage profile on request. Build with
# `-C instrument-coverage`; `examples/verify_device --coverage` does both.
coverage = ["probe"]

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
leptoskit_native = { workspace = true, features = ["serde"] }
leptoskit_yoga = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
android_apk = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
