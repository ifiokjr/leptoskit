[package]
name = "leptoskit_rpc_macros"
version = "0.1.1"
authors.workspace = true
categories = ["web-programming", "development-tools::procedural-macro-helpers"]
edition.workspace = true
homepage.workspace = true
keywords = ["leptos", "server", "functions", "leptoskit", "macros"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "The #[api] attribute behind leptoskit_rpc: publishes leptos server functions to generated clients."

[lib]
proc-macro = true

[dependencies]
convert_case = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["full"] }

[dev-dependencies]
insta = { workspace = true }
prettyplease = { workspace = true }
# Spans from parsed source text, so diagnostics tests can check what an error
# underlines.
proc-macro2 = { workspace = true, features = ["span-locations"] }

[features]
default = []
# Registers the function descriptions the server exports. Enabled through
# `leptoskit_rpc/ssr`; the attribute is a pure pass-through without it.
ssr = []

[lints]
workspace = true
