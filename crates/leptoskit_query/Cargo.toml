[package]
name = "leptoskit_query"
version.workspace = true
authors.workspace = true
categories = ["web-programming", "gui", "asynchronous", "caching"]
edition.workspace = true
homepage.workspace = true
keywords = ["leptos", "query", "cache", "async", "leptoskit"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Async state management for leptos in the style of TanStack Query: cached, deduplicated, retrying queries, infinite queries, and mutations built on fine-grained signals."

[dependencies]
any_spawner = { workspace = true }
futures = { workspace = true }
hydration_context = { workspace = true }
leptos = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time", "rt"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Event", "EventTarget", "Navigator", "VisibilityState", "Window"] }

[dev-dependencies]
any_spawner = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
