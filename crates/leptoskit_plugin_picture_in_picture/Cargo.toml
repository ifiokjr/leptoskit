[package]
name = "leptoskit_plugin_picture_in_picture"
version = "0.3.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Cross-mobile picture-in-picture and system overlay windows for LeptosKit."

[package.metadata.leptoskit.runtime]
name = "picture-in-picture"
apple-module = "LeptosKitPictureInPicture"
apple-type = "PictureInPicturePlugin"
android-type = "dev.leptoskit.plugins.pictureinpicture.PictureInPicturePlugin"
android-context = true
android-permissions = ["android.permission.SYSTEM_ALERT_WINDOW"]

[features]
guest = ["leptoskit_bridge/guest"]

[dependencies]
leptoskit_bridge = { workspace = true }

[lints]
workspace = true
