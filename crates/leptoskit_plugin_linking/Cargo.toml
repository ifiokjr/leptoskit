[package]
name = "leptoskit_plugin_linking"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Validated external links and app settings for LeptosKit."

[package.metadata.leptoskit.runtime]
name = "linking"
apple-module = "LeptosKitLinking"
apple-type = "LinkingPlugin"
android-type = "dev.leptoskit.plugins.linking.LinkingPlugin"
android-context = true

[features]
guest = ["leptoskit_bridge/guest"]

[dependencies]
leptoskit_bridge = { workspace = true }
url = "2"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
open = "5.4.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { workspace = true, features = ["NSWorkspace"] }
objc2-foundation = { workspace = true, features = ["NSURL", "NSString"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-sys = { workspace = true, features = ["Window"] }

[lints]
workspace = true
