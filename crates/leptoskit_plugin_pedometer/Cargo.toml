[package]
name = "leptoskit_plugin_pedometer"
version = "0.1.1"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Cancellable pedometer readings for LeptosKit."

[package.metadata.leptoskit.runtime]
name = "pedometer"
apple-module = "LeptosKitPedometer"
apple-type = "PedometerPlugin"
android-type = "dev.leptoskit.plugins.pedometer.PedometerPlugin"
android-context = true

[features]
guest = ["leptoskit_bridge/guest", "leptoskit_sensor/guest"]

[dependencies]
leptoskit_bridge = { workspace = true }
leptoskit_sensor = { workspace = true }

[lints]
workspace = true
