[package]
name = "leptoskit_plugin_localization"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Locale, language, region and calendar preferences for LeptosKit."

[package.metadata.leptoskit.runtime]
name = "localization"
apple-module = "LeptosKitLocalization"
apple-type = "LocalizationPlugin"
android-type = "dev.leptoskit.plugins.localization.LocalizationPlugin"
android-context = true

[features]
guest = ["leptoskit_bridge/guest"]

[dependencies]
leptoskit_bridge = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows", all(target_os = "linux", not(target_env = "ohos"))))'.dependencies]
sys-locale = "0.3.2"
iana-time-zone = "0.1.65"
unic-langid = "0.9.6"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3"
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Navigator"] }

[lints]
workspace = true
