[package]
name = "leptoskit_plugin_dialog"
version = "0.1.1"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Asynchronous native desktop dialogs and browser file selection for LeptosKit."

[dependencies]
thiserror = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
raw-window-handle = "0.6"
rfd = "0.17.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Keep Wayland parenting without requiring its development headers at build time.
wayland-backend = { version = "0.3", features = ["dlopen"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3"
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["Window", "File", "Blob", "DomException"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dev-dependencies]
futures = { workspace = true, features = ["executor"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The fixture window mirrors leptoskit_gtk: GTK 4.6 is the newest API it uses.
# wayland_crate lends the wl_surface and wl_display pointers the portal needs.
gdk-wayland = { package = "gdk4-wayland", version = "0.9", features = ["wayland_crate"] }
gtk = { package = "gtk4", version = "0.9", features = ["v4_6"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
dispatch2 = "0.3"
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["std", "NSApplication", "NSButton", "NSControl", "NSGraphics", "NSResponder", "NSRunningApplication", "NSText", "NSTextField", "NSView", "NSWindow"] }
objc2-foundation = { workspace = true, features = ["std", "NSGeometry", "NSString"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
