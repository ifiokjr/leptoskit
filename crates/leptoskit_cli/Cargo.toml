[package]
name = "leptoskit_cli"
version.workspace = true
authors.workspace = true
categories = ["command-line-utilities", "development-tools", "wasm"]
edition.workspace = true
homepage.workspace = true
keywords = ["leptos", "cli", "leptoskit"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
# wasm-split, which the CLI runs in process, needs `if let` match guards:
# stable since Rust 1.95.
rust-version = "1.95"
description = "The command line interface for building, serving, and shipping leptos apps."

[[bin]]
name = "leptoskit"
# The library carries the docs; documenting the binary would collide with the
# `leptoskit` meta crate.
doc = false
path = "src/main.rs"

# The short alias: a one-line target over the same entry point, so
# `cargo install leptoskit_cli` puts `lk` next to `leptoskit`. A separate
# path rather than a second name on `src/main.rs`, which cargo would warn
# about on every build.
[[bin]]
name = "lk"
doc = false
path = "src/bin/lk.rs"

# `cargo binstall` reads this to resolve a prebuilt binary from the GitHub release that
# publish.yml's upload job fills, so installing the CLI does not compile it from source. The
# archive is named for the binary (`leptoskit`) rather than the crate (`leptoskit_cli`), and
# every target ships a tarball because the upload job archives tar on all platforms. Both
# binaries, `leptoskit` and `lk`, come out of that one archive.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/leptoskit-{ target }-v{ version }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
brotli = { workspace = true }
camino = { workspace = true }
clap = { workspace = true, features = ["derive"] }
clap_complete = { workspace = true }
flate2 = { workspace = true }
fs4 = "1"
getrandom = { workspace = true }
hex = { workspace = true }
ignore = { workspace = true }
leptoskit_axum = { workspace = true }
leptoskit_codepush = { workspace = true }
leptoskit_config = { workspace = true }
leptoskit_fmt = { workspace = true, features = ["cli"] }
leptoskit_plugin = { workspace = true }
leptoskit_plugin_router = { workspace = true }
leptoskit_router_codegen = { workspace = true }
leptoskit_rpc_codegen = { workspace = true, features = ["generators"] }
leptoskit_testing = { workspace = true, features = ["native-ui"] }
leptoskit_wasm = { workspace = true }
notify = { workspace = true }
plist = "1.10"
rayon = { workspace = true }
roxmltree = "0.21"
rusty-s3 = { workspace = true, features = ["rustcrypto"] }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
toml = { workspace = true }
ureq = { workspace = true, features = ["rustls"] }
url = { workspace = true }
walkdir = { workspace = true }
wasm-bindgen-cli-support = { workspace = true }
wasm-bindgen-shared = { workspace = true }
wasm_split_cli_support = { workspace = true }
wasmparser = { workspace = true }

[dev-dependencies]
axum = { workspace = true, features = ["ws"] }
futures = { workspace = true }
# `filters` masks the time-dependent bundle hash, `redactions` the creation
# timestamp in the codepush manifest snapshots, and `json` those manifests.
insta = { workspace = true, features = ["filters", "json", "redactions"] }
leptoskit_native = { workspace = true }
tempfile = "3"
wasmi = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[lints]
workspace = true
