[package]
name = "leptoskit_cli"
version = "0.3.0"
authors.workspace = true
categories = ["command-line-utilities", "development-tools", "wasm"]
edition.workspace = true
homepage.workspace = true
keywords = ["leptos", "cli", "leptoskit"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "The command line interface for building, serving, and shipping leptos apps."

[[bin]]
name = "leptoskit"
# The library carries the docs; documenting the binary would collide with the
# `leptoskit` meta crate.
doc = false
path = "src/main.rs"

# The short alias: a one-line target over the same entry point, so
# `cargo install leptoskit_cli` puts `lk` next to `leptoskit`. A separate
# path rather than a second name on `src/main.rs`, which cargo would warn
# about on every build.
[[bin]]
name = "lk"
doc = false
path = "src/bin/lk.rs"

# `cargo binstall` reads this to resolve a prebuilt binary from the GitHub release that
# publish.yml's upload job fills, so installing the CLI does not compile it from source. The
# archive is named for the binary (`leptoskit`) rather than the crate (`leptoskit_cli`), and
# every target ships a tarball because the upload job archives tar on all platforms. Both
# binaries, `leptoskit` and `lk`, come out of that one archive.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/leptoskit-{ target }-v{ version }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
anstream = { workspace = true }
anstyle = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
brotli = { workspace = true }
camino = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
clap_complete = { workspace = true }
crc32fast = { workspace = true }
flate2 = { workspace = true }
fs4 = "1"
futures = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
# The development proxy in front of the app and its public services: a
# client that streams bodies and hands WebSocket upgrades through.
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
ignore = { workspace = true }
# App icons: one source image, resized for every platform; and the store
# screenshots, checked before they are uploaded.
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
leptoskit_analytics = { workspace = true }
leptoskit_auth = { workspace = true, features = ["oauth", "postgres", "sqlite"] }
leptoskit_axum = { workspace = true }
leptoskit_codepush = { workspace = true }
leptoskit_config = { workspace = true }
leptoskit_db = { workspace = true, features = ["postgres", "sqlite", "geo", "vector"] }
leptoskit_db_schema = { workspace = true }
leptoskit_deploy_console = { workspace = true, features = ["server"] }
leptoskit_devtools_protocol = { workspace = true }
leptoskit_fmt = { workspace = true, features = ["cli"] }
leptoskit_idp = { workspace = true }
leptoskit_l10n_codegen = { workspace = true }
leptoskit_lint = { workspace = true }
leptoskit_plugin = { workspace = true }
leptoskit_plugin_router = { workspace = true }
leptoskit_router_codegen = { workspace = true }
leptoskit_rpc_codegen = { workspace = true, features = ["generators"] }
leptoskit_testing = { workspace = true, features = ["native-ui", "schema"] }
leptoskit_wasm = { workspace = true }
# The checksum App Store Connect asks for with each uploaded screenshot.
md-5 = "0.11"
notify = { workspace = true }
plist = "1.10"
# Hashes a development role's password into a SCRAM verifier, so the
# password itself never reaches Postgres or its logs.
postgres-protocol = { workspace = true }
postgresql_embedded = { workspace = true }
rayon = { workspace = true }
# Draws an SVG app icon; its text features are off, as icons are shapes.
resvg = { version = "0.49", default-features = false }
ring = { workspace = true }
roxmltree = "0.21"
rusty-s3 = { workspace = true, features = ["rustcrypto"] }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "io-util"] }
toml = { workspace = true }
toml_edit = { workspace = true }
# WebDriver BiDi uses a loopback WebSocket; no TLS backend is needed.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
ureq = { workspace = true, features = ["rustls", "json"] }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
walkdir = { workspace = true }
wasm-bindgen-cli-support = { workspace = true }
wasm-bindgen-shared = { workspace = true }
wasm_split_cli_support = { workspace = true }
wasmparser = { workspace = true }

[dev-dependencies]
axum = { workspace = true, features = ["ws"] }
futures = { workspace = true }
# The development proxy's test reads streamed bodies a frame at a time and
# speaks WebSocket through it.
http-body-util = "0.1"
# `filters` masks the time-dependent bundle hash, `redactions` the creation
# timestamp in the codepush manifest snapshots, and `json` those manifests.
insta = { workspace = true, features = ["filters", "json", "redactions"] }
leptoskit_codepush = { workspace = true, features = ["http"] }
leptoskit_native = { workspace = true }
# The jobs table the `jobs` commands read, and jobs to put in it.
leptoskit_rpc = { workspace = true, features = ["live", "postgres", "sqlite"] }
png = { workspace = true }
tempfile = "3"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
tower = { workspace = true, features = ["util"] }
wasmi = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[lints]
workspace = true
