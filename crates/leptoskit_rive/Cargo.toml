[package]
name = "leptoskit_rive"
version.workspace = true
authors.workspace = true
categories = ["gui", "rendering", "wasm"]
documentation = "https://docs.rs/leptoskit_rive"
edition.workspace = true
homepage.workspace = true
include = ["src/**", "/build.rs", "/Cargo.toml", "/readme.md"]
keywords = ["leptos", "rive", "animation"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Bounded Rive assets with owned browser and native vector playback for leptoskit."

[dependencies]
base64 = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
leptoskit_rive_runtime = { workspace = true, optional = true }
tiny-skia = { workspace = true, optional = true }

[build-dependencies]
cc = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["console", "HtmlCanvasElement"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
flate2 = { workspace = true }
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = ["Blob", "BlobPropertyBag", "CanvasRenderingContext2d", "Document", "HtmlElement", "ImageData", "Url", "Window"] }

[features]
default = []
native = ["dep:tiny-skia", "dep:leptoskit_rive_runtime"]
serde = ["dep:base64", "dep:serde"]
web = ["dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]

[lints]
workspace = true
