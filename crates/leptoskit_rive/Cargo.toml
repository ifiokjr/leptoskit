[package]
name = "leptoskit_rive"
version.workspace = true
authors.workspace = true
categories = ["gui", "rendering", "wasm"]
documentation = "https://docs.rs/leptoskit_rive"
edition.workspace = true
homepage.workspace = true
include = ["src/**", "/Cargo.toml", "/readme.md"]
keywords = ["leptos", "rive", "animation"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Bounded Rive assets and lifecycle-managed browser playback for leptoskit."

[dependencies]
thiserror = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["console", "HtmlCanvasElement"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
flate2 = { workspace = true }
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = ["Blob", "BlobPropertyBag", "CanvasRenderingContext2d", "Document", "HtmlElement", "ImageData", "Url", "Window"] }

[features]
default = []
web = ["dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]

[lints]
workspace = true
