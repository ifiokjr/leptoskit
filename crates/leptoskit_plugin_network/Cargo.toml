[package]
name = "leptoskit_plugin_network"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Network connection hints and cancellable change observation for LeptosKit."

[package.metadata.leptoskit.runtime]
name = "network"
apple-module = "LeptosKitNetwork"
apple-type = "NetworkPlugin"
android-type = "dev.leptoskit.plugins.network.NetworkPlugin"
android-context = true
android-permissions = ["android.permission.ACCESS_NETWORK_STATE"]

[features]
guest = ["leptoskit_bridge/guest"]
hooks = ["dep:reactive_graph"]

[dependencies]
leptoskit_bridge = { workspace = true }
reactive_graph = { workspace = true, optional = true }

[dev-dependencies]
futures = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
if-addrs = "0.15"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
futures = { workspace = true }
gloo-events = "0.2"
js-sys = "0.3"
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Navigator", "EventTarget"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
