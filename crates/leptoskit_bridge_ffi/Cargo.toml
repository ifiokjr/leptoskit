[package]
name = "leptoskit_bridge_ffi"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "C ABI for Swift, C++, and Android NDK LeptosKit plugin hosts."

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
futures = { workspace = true, optional = true }
leptoskit_bridge = { workspace = true }
leptoskit_codepush = { workspace = true, features = ["http"], optional = true }
leptoskit_native = { workspace = true, features = ["serde"], optional = true }
leptoskit_wasm = { workspace = true, optional = true }
leptoskit_yoga = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "macros"], optional = true }

[features]
app = [
	"dep:leptoskit_codepush",
	"dep:leptoskit_appkit",
	"dep:leptoskit_uikit",
	"dep:leptoskit_native",
	"dep:leptoskit_wasm",
	"dep:leptoskit_yoga",
	"dep:serde",
	"dep:serde_json",
	"leptoskit_native/rive",
	"leptoskit_wasm/rive",
]
async-host = ["app", "leptoskit_bridge/async-host", "dep:tokio", "dep:futures"]
# Reports the running app to the DevTools hub. `leptoskit dev` turns this on
# for debug hosts; `leptoskit build` never does, and release builds refuse to
# report even with it.
devtools = [
	"app",
	"dep:leptoskit_devtools",
	"dep:leptoskit_devtools_protocol",
	"leptoskit_native/devtools",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
leptoskit_devtools = { workspace = true, optional = true, default-features = false, features = ["host"] }
leptoskit_devtools_protocol = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
leptoskit_appkit = { workspace = true, optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
leptoskit_uikit = { workspace = true, optional = true }

[dev-dependencies]
base64 = { workspace = true }
leptoskit_rive = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "native_roundtrip"
harness = false
required-features = ["app"]

[lints]
workspace = true
