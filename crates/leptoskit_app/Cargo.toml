[package]
name = "leptoskit_app"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description = "The LeptosKit hosted infrastructure app for web, iOS and Android."

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "leptoskit-cloud"
path = "src/server.rs"
required-features = ["server"]

[[bin]]
name = "leptoskit-site"
path = "src/package.rs"
required-features = ["site"]

[features]
default = []
web = [
	"leptoskit/web",
	"dep:leptos",
	"dep:wasm-bindgen",
	"leptoskit_plugin_http/browser",
	"dep:web-sys",
	"dep:leptoskit_plugin_clipboard",
]
csr = ["web", "leptos/csr"]
native = [
	"dep:sha2",
	"dep:url",
	"leptoskit/guest",
	"leptoskit_plugin_http/guest",
	"leptoskit_plugin_secure_store/guest",
	"leptoskit_plugin_clipboard/guest",
	"leptoskit_plugin_linking/guest",
]
ios = ["native"]
android = ["native"]
server = [
	"leptoskit/server",
	"leptoskit_deploy_console/server",
	"dep:anyhow",
	"dep:axum",
	"dep:clap",
	"dep:tokio",
	"dep:tower-http",
]
site = ["server", "dep:flate2", "dep:leptoskit_docs_site"]

[dependencies]
any_spawner = { workspace = true }
anyhow = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
clap = { workspace = true, optional = true, features = ["derive"] }
flate2 = { workspace = true, optional = true }
futures = { workspace = true, features = ["executor"] }
leptoskit = { workspace = true, features = ["rive"] }
leptoskit_deploy_console = { workspace = true }
leptoskit_docs_site = { workspace = true, optional = true }
reactive_graph = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, optional = true, features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { workspace = true, optional = true, features = ["fs", "set-header"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { workspace = true, optional = true }
leptoskit_plugin_clipboard = { workspace = true, optional = true }
leptoskit_plugin_http = { workspace = true, default-features = false, optional = true }
leptoskit_plugin_linking = { workspace = true, optional = true }
leptoskit_plugin_secure_store = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
url = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["Window", "Location", "Document", "Element", "HtmlElement", "Node"] }

[dev-dependencies]
leptoskit_testing = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
