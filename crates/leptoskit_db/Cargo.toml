[package]
name = "leptoskit_db"
version.workspace = true
authors.workspace = true
categories = ["database", "web-programming"]
edition.workspace = true
homepage.workspace = true
keywords = ["database", "orm", "postgres", "sqlite", "leptoskit"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "leptoskit's database layer: tables declared as Rust structs, typed IDs, and client-safe public projections."

[dependencies]
axum = { workspace = true, optional = true, features = ["form", "http1", "query", "tokio"] }
base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"] }
deadpool-postgres = { workspace = true, optional = true, features = ["rt_tokio_1"] }
geo = { workspace = true, optional = true }
geo-traits = { workspace = true, optional = true }
geo-types = { workspace = true, optional = true }
geojson = { workspace = true, optional = true, features = ["geo-types"] }
getrandom = { workspace = true, optional = true }
inventory = { workspace = true, optional = true }
leptos = { workspace = true, optional = true, features = ["ssr"] }
leptoskit_db_macros = { workspace = true }
leptoskit_db_schema = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true, features = ["bundled", "cache"] }
rustls = { workspace = true, optional = true, features = ["ring", "std", "tls12"] }
schemars = { workspace = true, features = ["chrono04", "uuid1"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["sync"] }
tokio-postgres = { workspace = true, optional = true, features = ["runtime", "with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = { workspace = true, optional = true }
uuid = { workspace = true, features = ["serde", "v5"] }
webpki-roots = { workspace = true, optional = true }
wkb = { workspace = true, optional = true }

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
proptest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[features]
default = []
## Everything that touches a database: rows, columns, schema export, and the
## driver. Never enable it in a client build.
server = [
	"dep:inventory",
	"dep:leptoskit_db_schema",
	"dep:serde_json",
	"dep:sha2",
	"dep:tokio",
	"regex",
	"uuid/v7",
]
## Connect to Postgres, the default dialect, through `tokio-postgres`, with
## TLS (rustls and the webpki roots) for hosted databases.
postgres = [
	"server",
	"dep:bytes",
	"dep:deadpool-postgres",
	"dep:rustls",
	"dep:tokio-postgres",
	"dep:tokio-postgres-rustls",
	"dep:webpki-roots",
	"tokio/rt",
	"tokio/time",
]
## Connect to SQLite, bundled, through `rusqlite`: the same SQLite the
## on-device plugin uses, run on tokio's blocking pool.
sqlite = ["server", "dep:rusqlite", "tokio/rt"]

## Geospatial columns: `Geography<T>` and `Geo<T, Srid<N>>`, sent as GeoJSON,
## with the `geo` crate's algorithms. Client-safe on its own; with `postgres`
## it uses PostGIS, and with `sqlite` a built-in layer of the same operations.
geo = [
	"dep:base64",
	"dep:geo",
	"dep:geo-traits",
	"dep:geo-types",
	"dep:geojson",
	"dep:serde_json",
	"dep:wkb",
	"rusqlite?/functions",
]
## Checks `regex` rules in `validate()`. Always on with `server`; opt in on the
## client.
regex = ["dep:regex"]
## The studio, a browser UI for the development database that `leptoskit db
## studio` serves. Compiled only in builds with debug assertions: a release
## build leaves it out even with this feature on. Never enable it for a
## deployed server.
studio = [
	"server",
	"dep:axum",
	"dep:getrandom",
	"dep:leptos",
	"tokio/macros",
	"tokio/net",
	"tokio/rt-multi-thread",
]

[lints]
workspace = true
