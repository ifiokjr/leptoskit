[package]
name = "leptoskit_axum"
version.workspace = true
authors.workspace = true
categories = ["web-programming", "development-tools"]
edition.workspace = true
homepage.workspace = true
keywords = ["leptos", "axum", "server", "leptoskit"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Axum server toolkit for leptoskit apps: static assets, code push endpoints, and the dev server."

[dependencies]
axum = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
leptoskit_codepush = { workspace = true, features = ["server"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "net", "rt", "signal"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["fs", "compression-gzip"] }

[dev-dependencies]
http-body-util = "0.1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
