[package]
name = "leptoskit_axum"
version = "0.1.1"
authors.workspace = true
categories = ["web-programming", "development-tools"]
edition.workspace = true
homepage.workspace = true
keywords = ["leptos", "axum", "server", "leptoskit"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Axum server toolkit for leptoskit apps: static assets, code push endpoints, and the dev server."

[dependencies]
axum = { workspace = true }
leptoskit_codepush = { workspace = true, features = ["server"] }
# `[native]` describes the apps whose associations the site publishes.
leptoskit_config = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Re-exported for server binaries, so `#[tokio::main]` and a multi-threaded
# runtime work through this crate alone.
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
# Re-exported with the layers a production router needs: timeouts, body
# limits, concurrency limits, and load shedding.
tower = { workspace = true, features = ["limit", "load-shed", "util"] }
tower-http = { workspace = true, features = ["fs", "limit", "set-header", "timeout"] }

[dev-dependencies]
http-body-util = "0.1"
semver = { workspace = true }

[lints]
workspace = true
