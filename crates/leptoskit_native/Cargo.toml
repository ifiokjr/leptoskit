[package]
name = "leptoskit_native"
version.workspace = true
authors.workspace = true
categories = ["gui", "rendering"]
edition.workspace = true
homepage.workspace = true
keywords = ["gui", "native", "renderer", "leptos"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "The leptoskit native renderer: shadow tree, diffing, and platform backend contracts."

[dependencies]
leptos = { workspace = true, optional = true }
leptoskit_devtools_protocol = { workspace = true, optional = true }
leptoskit_rive = { workspace = true }
leptoskit_yoga = { workspace = true }
roxmltree = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["AddEventListenerOptions", "CssStyleDeclaration", "Document", "Element", "HtmlElement", "HtmlInputElement", "KeyboardEvent", "NodeList", "ScrollBehavior", "ScrollToOptions", "Window"] }

[dev-dependencies]
# Without default features: divan's `wrap_help` turns on clap's help
# wrapping for the whole workspace's test build.
divan = { version = "0.1", default-features = false }
insta = { workspace = true, features = ["json"] }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
flate2 = { workspace = true }
js-sys = { workspace = true }
leptos = { workspace = true, features = ["csr", "hydrate"] }
wasm-bindgen-futures = { workspace = true }
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = ["Blob", "BlobPropertyBag", "CanvasRenderingContext2d", "CssStyleDeclaration", "Document", "DomRect", "EventInit", "FocusEvent", "HtmlCanvasElement", "HtmlCollection", "HtmlElement", "HtmlIFrameElement", "ImageData", "KeyboardEventInit", "MouseEvent", "MouseEventInit", "NodeList", "Range", "Url", "Window"] }

[[bench]]
name = "vector"
harness = false

[features]
default = []
devtools = ["dep:leptoskit_devtools_protocol"]
rive = ["leptoskit_rive/native", "leptoskit_rive/web"]
guest = ["serde", "dep:serde_json"]
serde = ["dep:serde", "dep:serde_json", "leptoskit_yoga/serde", "leptoskit_rive/serde"]
svg = ["dep:roxmltree"]
web = ["dep:leptos", "dep:sha2", "dep:wasm-bindgen", "dep:web-sys"]

[lints]
workspace = true
