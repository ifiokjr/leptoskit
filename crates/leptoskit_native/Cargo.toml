[package]
name = "leptoskit_native"
version.workspace = true
authors.workspace = true
categories = ["gui", "rendering"]
edition.workspace = true
homepage.workspace = true
keywords = ["gui", "native", "renderer", "leptos"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "The leptoskit native renderer: shadow tree, diffing, and platform backend contracts."

[dependencies]
leptos = { workspace = true, optional = true }
leptoskit_yoga = { workspace = true }
roxmltree = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["CssStyleDeclaration", "Element", "HtmlElement", "HtmlInputElement", "KeyboardEvent", "NodeList", "Window"] }

[dev-dependencies]
# Without default features: divan's `wrap_help` turns on clap's help
# wrapping for the whole workspace's test build.
divan = { version = "0.1", default-features = false }
insta = { workspace = true, features = ["json"] }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
leptos = { workspace = true, features = ["csr", "hydrate"] }
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = ["CssStyleDeclaration", "Document", "DomRect", "EventInit", "FocusEvent", "HtmlCollection", "HtmlElement", "HtmlIFrameElement", "KeyboardEventInit", "MouseEvent", "MouseEventInit", "NodeList", "Range", "Window"] }

[[bench]]
name = "vector"
harness = false

[features]
default = []
guest = ["serde", "dep:serde_json"]
serde = ["dep:serde", "leptoskit_yoga/serde"]
svg = ["dep:roxmltree"]
web = ["dep:leptos", "dep:sha2", "dep:wasm-bindgen", "dep:web-sys"]

[lints]
workspace = true
