[package]
name = "leptoskit_wasm"
version.workspace = true
authors.workspace = true
categories = ["wasm", "gui"]
edition.workspace = true
homepage.workspace = true
keywords = ["wasm", "leptos", "native"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "The on-device wasm runtime host that runs the leptoskit app bundle against a native backend."

[dependencies]
leptoskit_bridge = { workspace = true }
leptoskit_native = { workspace = true, features = ["serde"] }
leptoskit_rive = { workspace = true, features = ["serde"] }
leptoskit_yoga = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
wasmi = { workspace = true }
wasmi_core = { workspace = true }

[dev-dependencies]
wasmi = { workspace = true, features = ["wat"] }

[features]
rive = ["leptoskit_native/rive"]

[lints]
workspace = true
