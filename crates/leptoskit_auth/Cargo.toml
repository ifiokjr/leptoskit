[package]
name = "leptoskit_auth"
version.workspace = true
authors.workspace = true
categories = ["authentication", "web-programming"]
edition.workspace = true
homepage.workspace = true
keywords = ["auth", "sessions", "passkeys", "leptoskit"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Sign-in for leptoskit apps: the auth schema pack, sessions, email codes, and the signed-in user that access policies read."

[dependencies]
# TOTP secrets are encrypted at rest with AES-256-GCM-SIV, which stays safe if
# a nonce ever repeats.
aes-gcm-siv = { version = "0.11", optional = true }
axum = { workspace = true, optional = true, features = ["form", "json", "query"] }
base64 = { workspace = true, optional = true }
chrono = { workspace = true }
# Verifies wallets' Sign-In With Solana signatures, strictly (no small-order
# keys, no malleable signatures).
ed25519-dalek = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
leptos = { workspace = true, optional = true }
leptoskit_config = { workspace = true, optional = true }
leptoskit_db = { workspace = true, features = ["solana"] }
leptoskit_query = { workspace = true, optional = true }
lettre = { version = "0.11", optional = true, default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "tokio1-rustls-tls"] }
# webauthn-rs verifies signatures with OpenSSL. Building it from source keeps
# servers buildable where no OpenSSL headers are installed (macOS, Windows,
# containers), at the cost of a longer first build.
openssl = { version = "0.10", optional = true, features = ["vendored"] }
# Draws the authenticator setup link as a QR code, in the browser and in
# native apps alike.
qrcode = { version = "0.14", optional = true, default-features = false }
reqwest = { workspace = true, optional = true, features = ["rustls-tls"] }
# Verifies third-party ID tokens (RS256, PS256, ES256, ES384, EdDSA) and signs
# Sign in with Apple's client secret. Already in the graph through rustls.
ring = { version = "0.17", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
# HMAC-SHA-1 for TOTP: RFC 6238's algorithm, the one every authenticator app
# supports.
sha1 = { version = "0.10", optional = true }
sha2 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
thiserror = { workspace = true }
tower = { workspace = true, optional = true }
url = { workspace = true, optional = true }
# Passkeys: the kanidm project's WebAuthn relying party. Ceremony state is
# serialized, sealed, and kept in `auth.challenges`; credential internals are
# read for the backup flags only.
webauthn-rs = { version = "0.5.4", optional = true, default-features = false, features = ["conditional-ui", "danger-allow-state-serialisation", "danger-credential-internals"] }
# The WebAuthn messages the routes carry. Serde types only, so every client
# can build them.
webauthn-rs-proto = "0.5.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptoskit_bridge = { workspace = true, optional = true }
leptoskit_plugin_http = { workspace = true, optional = true, features = ["guest"] }
leptoskit_plugin_passkeys = { workspace = true, optional = true, features = ["guest"] }
leptoskit_plugin_web_auth = { workspace = true, optional = true, features = ["guest"] }
leptoskit_plugin_secure_store = { workspace = true, optional = true, features = ["guest"] }
send_wrapper = { workspace = true, optional = true, features = ["futures"] }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["AbortController", "AbortSignal", "CredentialCreationOptions", "CredentialRequestOptions", "CredentialsContainer", "CustomEvent", "CustomEventInit", "Event", "EventTarget", "Headers", "Location", "Navigator", "PublicKeyCredential", "Request", "RequestCredentials", "RequestInit", "RequestMode", "Response", "Window"] }
js-sys = { workspace = true, optional = true }

[dev-dependencies]
any_spawner = { workspace = true, features = ["tokio"] }
axum = { workspace = true, features = ["tokio"] }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
hmac = { workspace = true }
http-body-util = "0.1"
leptoskit_config = { workspace = true }
# The desktop loopback, end to end against the fake identity provider.
leptoskit_plugin_web_auth = { workspace = true }
proptest = { workspace = true }
# The tests' passkey and fake identity provider sign with keys made at test
# time.
ring = "0.17"
serde_json = { workspace = true }
sha1 = "0.10"
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
url = { workspace = true }

[features]
default = []
## Everything that runs on the server: sessions, email codes, rate limits,
## and audit events. Pick a database too, with `postgres` or `sqlite`.
server = [
	"dep:aes-gcm-siv",
	"dep:base64",
	"dep:getrandom",
	"dep:hmac",
	"dep:leptoskit_config",
	"dep:serde_json",
	"dep:sha1",
	"dep:sha2",
	"dep:subtle",
	"leptoskit_db/server",
]
## Sign-in backed by Postgres.
postgres = ["server", "leptoskit_db/postgres"]
## Sign-in backed by SQLite.
sqlite = ["server", "leptoskit_db/sqlite"]
## The `/auth` routes and the session layer, for axum servers.
axum = ["server", "dep:axum", "dep:tower"]
## Passkeys: WebAuthn registration and sign-in, with `webauthn-rs`. Needs
## `[auth] origin`, whose host is the relying party.
passkey = ["server", "dep:openssl", "dep:url", "dep:webauthn-rs"]
## Third-party sign-in: OpenID Connect and OAuth 2 providers, such as Google,
## Apple, Microsoft, GitHub, or any OpenID Connect issuer.
oauth = ["server", "dep:reqwest", "dep:ring", "dep:url"]
## Solana wallets: linking with Sign-In With Solana proofs, fresh proofs,
## and optional sign-in, verified as ed25519. Needs `[auth] origin`, whose
## host the messages are bound to.
solana = ["server", "dep:ed25519-dalek"]
## Sends email over SMTP, with `SmtpMailer`.
smtp = ["server", "dep:lettre"]
## Sends email as a signed webhook, with `WebhookMailer`.
webhook = ["server", "dep:reqwest", "dep:serde_json"]
## Guards for leptos server functions: `require_signed_in` and `request_db`.
leptos = ["axum", "dep:leptos"]
## The headless client: the query and mutation scopes a sign-in screen is
## built from, the same on every platform. On its own it has no way to reach
## the server; `web`, `guest`, or `ssr` gives it one.
client = ["dep:futures", "dep:leptos", "dep:leptoskit_query", "dep:qrcode", "dep:serde_json"]
## The client in the browser: same-origin `fetch`, with the session in the
## `HttpOnly` cookie.
web = [
	"client",
	"leptoskit_query/browser",
	"dep:js-sys",
	"dep:send_wrapper",
	"dep:wasm-bindgen",
	"dep:wasm-bindgen-futures",
	"dep:web-sys",
	"webauthn-rs-proto/wasm",
]
## The client in a native app's Wasm guest: the HTTP plugin, with the refresh
## token in the secure store; passkeys and Sign in with Apple through the
## passkeys plugin, and other providers in the system browser through the
## web-auth plugin.
guest = [
	"client",
	"leptoskit_query/guest",
	"dep:leptoskit_bridge",
	"dep:leptoskit_plugin_http",
	"dep:leptoskit_plugin_passkeys",
	"dep:leptoskit_plugin_secure_store",
	"dep:leptoskit_plugin_web_auth",
]
## The client during server rendering: it reads the request's session in
## process.
ssr = ["client", "leptos", "leptos/ssr"]

[lints]
workspace = true
