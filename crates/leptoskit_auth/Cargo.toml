[package]
name = "leptoskit_auth"
version.workspace = true
authors.workspace = true
categories = ["authentication", "web-programming"]
edition.workspace = true
homepage.workspace = true
keywords = ["auth", "sessions", "passkeys", "leptoskit"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Sign-in for leptoskit apps: the auth schema pack, sessions, email codes, and the signed-in user that access policies read."

[dependencies]
axum = { workspace = true, optional = true, features = ["json"] }
base64 = { workspace = true, optional = true }
chrono = { workspace = true }
futures = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
leptos = { workspace = true, optional = true }
leptoskit_config = { workspace = true, optional = true }
leptoskit_db = { workspace = true }
leptoskit_query = { workspace = true, optional = true }
leptoskit_rpc = { workspace = true, optional = true }
lettre = { version = "0.11", optional = true, default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "tokio1-rustls-tls"] }
reqwest = { workspace = true, optional = true, features = ["rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
thiserror = { workspace = true }
tower = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptoskit_bridge = { workspace = true, optional = true }
leptoskit_plugin_http = { path = "../leptoskit_plugin_http", version = "0.1.0", optional = true, default-features = false, features = ["guest"] }
leptoskit_plugin_secure_store = { path = "../leptoskit_plugin_secure_store", version = "0.1.0", optional = true, features = ["guest"] }
send_wrapper = { workspace = true, optional = true, features = ["futures"] }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["Headers", "Request", "RequestCredentials", "RequestInit", "RequestMode", "Response", "Window"] }

[dev-dependencies]
any_spawner = { workspace = true, features = ["tokio"] }
axum = { workspace = true, features = ["tokio"] }
base64 = { workspace = true }
hmac = { workspace = true }
http-body-util = "0.1"
leptoskit_config = { workspace = true }
leptoskit_rpc = { workspace = true, features = ["sqlite"] }
schemars = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[features]
default = []
## Everything that runs on the server: sessions, email codes, rate limits,
## and audit events. Pick a database too, with `postgres` or `sqlite`.
server = [
	"dep:base64",
	"dep:getrandom",
	"dep:hmac",
	"dep:leptoskit_config",
	"dep:sha2",
	"dep:subtle",
	"leptoskit_db/server",
	"leptoskit_rpc?/db",
]
## Sign-in backed by Postgres.
postgres = ["server", "leptoskit_db/postgres"]
## Sign-in backed by SQLite.
sqlite = ["server", "leptoskit_db/sqlite"]
## The `/auth` routes and the session layer, for axum servers.
axum = ["server", "dep:axum", "dep:tower"]
## Sends email over SMTP, with `SmtpMailer`.
smtp = ["server", "dep:lettre"]
## Sends email as a signed webhook, with `WebhookMailer`.
webhook = ["server", "dep:reqwest", "dep:serde_json"]
## Guards for leptos server functions: `require_signed_in` and `request_db`.
leptos = ["axum", "dep:leptos"]
## The headless client: the query and mutation scopes a sign-in screen is
## built from, the same on every platform. On its own it has no way to reach
## the server; `web`, `guest`, or `ssr` gives it one.
client = ["dep:futures", "dep:leptos", "dep:leptoskit_query", "dep:serde_json"]
## The client in the browser: same-origin `fetch`, with the session in the
## `HttpOnly` cookie.
web = [
	"client",
	"leptoskit_rpc?/web",
	"dep:send_wrapper",
	"dep:wasm-bindgen",
	"dep:wasm-bindgen-futures",
	"dep:web-sys",
]
## The client in a native app's Wasm guest: the HTTP plugin, with the refresh
## token in the secure store.
guest = [
	"client",
	"leptoskit_rpc?/guest",
	"dep:leptoskit_bridge",
	"dep:leptoskit_plugin_http",
	"dep:leptoskit_plugin_secure_store",
]
## The client during server rendering: it reads the request's session in
## process.
ssr = ["client", "leptos", "leptos/ssr"]
## Sign-in for `leptoskit_rpc`: with `axum` and a database, `Auth` implements
## `leptoskit_rpc::Identify`, so queries and mutations run as the signed-in
## person; with `client`, `client::configure` also sets up the RPC client,
## signing its calls the way it signs its own.
rpc = ["dep:leptoskit_rpc", "leptoskit_rpc/client"]

[lints]
workspace = true
