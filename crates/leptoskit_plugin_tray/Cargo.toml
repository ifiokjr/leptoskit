[package]
name = "leptoskit_plugin_tray"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Explicitly owned native desktop tray icons and bounded events for LeptosKit."

[dependencies]
thiserror = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
leptoskit_plugin_menu = { workspace = true }
parking_lot = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", features = ["blocking"] }
muda = { version = "0.21.2", default-features = false, features = ["snapshot"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSResponder"] }

[dev-dependencies]
libtest-mimic = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
dispatch2 = "0.3"
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSEvent", "NSGraphicsContext", "NSResponder"] }
objc2-foundation = { workspace = true, features = ["NSGeometry"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
dbus = { version = "0.9.12", features = ["vendored"] }

[lints]
workspace = true

[[test]]
name = "native"
harness = false

[[test]]
name = "linux_tray"
harness = false
