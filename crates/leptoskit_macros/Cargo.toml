[package]
name = "leptoskit_macros"
version = "0.1.1"
authors.workspace = true
categories = ["gui", "rendering"]
edition.workspace = true
homepage.workspace = true
keywords = ["leptos", "macro", "rstml", "native", "leptoskit"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "The view! markup macro and #[component] attribute for leptoskit's cross-platform components."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
proc-macro2-diagnostics = { workspace = true }
quote = { workspace = true }
rstml = { workspace = true }
syn = { workspace = true, features = ["full", "visit-mut"] }

[dev-dependencies]
insta = { workspace = true }
prettyplease = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
