[package]
name = "leptoskit_plugin_sharing"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Bounded text and web URL sharing through user-selected native share UI."

[package.metadata.leptoskit.runtime]
name = "sharing"
apple-module = "LeptosKitSharing"
apple-type = "SharingPlugin"
apple-context = true
android-type = "dev.leptoskit.plugins.sharing.SharingPlugin"
android-context = true

[features]
guest = ["leptoskit_bridge/guest"]

[dependencies]
leptoskit_bridge = { workspace = true }
url = "2"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
futures = { workspace = true }
js-sys = "0.3"
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["Window", "Navigator", "DomException"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
