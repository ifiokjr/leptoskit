[package]
name = "leptoskit_plugin_battery"
version = "0.1.1"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.89"
description = "Battery charge and power state for LeptosKit applications."

[package.metadata.leptoskit.runtime]
name = "battery"
apple-module = "LeptosKitBattery"
apple-type = "BatteryPlugin"
android-type = "dev.leptoskit.plugins.battery.BatteryPlugin"
android-context = true

[features]
guest = ["leptoskit_bridge/guest"]
hooks = ["dep:reactive_graph"]

[dependencies]
leptoskit_bridge = { workspace = true }
reactive_graph = { workspace = true, optional = true }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
starship-battery = "0.12"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3"
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["Window", "Navigator", "BatteryManager", "DomException", "Event", "EventTarget"] }

[dev-dependencies]
futures = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
