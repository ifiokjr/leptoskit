[package]
name = "leptoskit_plugin_magnetometer"
version = "0.1.1"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Cancellable magnetometer readings for LeptosKit."

[package.metadata.leptoskit.runtime]
name = "magnetometer"
apple-module = "LeptosKitMagnetometer"
apple-type = "MagnetometerPlugin"
android-type = "dev.leptoskit.plugins.magnetometer.MagnetometerPlugin"
android-context = true

[features]
guest = ["leptoskit_bridge/guest", "leptoskit_sensor/guest"]

[dependencies]
leptoskit_bridge = { workspace = true }
leptoskit_sensor = { workspace = true }

[lints]
workspace = true
