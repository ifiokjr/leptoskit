[package]
name = "leptoskit_plugin_store"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Bounded, transactional application settings for LeptosKit."

[package.metadata.leptoskit.runtime]
name = "store"
rust-factory = "from_app_dirs"
rust-worker = true

[features]
guest = ["leptoskit_bridge/guest"]
async-storage = ["dep:leptoskit_use", "dep:parking_lot", "dep:thiserror"]

[dependencies]
leptoskit_bridge = { workspace = true }
leptoskit_use = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cap-std = "4"
leptoskit_plugin_filesystem = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Storage", "DomException"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
futures = { workspace = true }
reactive_graph = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
futures = { workspace = true }
js-sys = "0.3"
reactive_graph = { workspace = true }
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
