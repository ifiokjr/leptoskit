[package]
name = "leptoskit_analytics"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Bounded application observability and agent-readable evidence for LeptosKit."

[features]
default = []
server = [
	"dep:axum",
	"dep:getrandom",
	"dep:reqwest",
	"dep:rustix",
	"dep:serde_json",
	"dep:sha2",
	"dep:subtle",
	"dep:tokio",
	"dep:url",
]

[dependencies]
axum = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["json", "rustls-tls"] }
rustix = { workspace = true, optional = true, features = ["fs"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["rt", "time"] }
url = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }

[[example]]
name = "server"
required-features = ["server"]

[lints]
workspace = true
