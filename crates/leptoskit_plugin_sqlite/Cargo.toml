[package]
name = "leptoskit_plugin_sqlite"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Bounded, application-private SQLite databases for LeptosKit."

[package.metadata.leptoskit.runtime]
name = "sqlite"
rust-factory = "from_app_dirs"
rust-worker = true

[features]
guest = ["leptoskit_bridge/guest"]

[dependencies]
leptoskit_bridge = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cap-std = "4"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "cache", "hooks", "limits", "extra_check"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"

[lints]
workspace = true
