[package]
name = "leptoskit_plugin_shell"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Scoped, bounded, cancellable desktop child processes for LeptosKit."

[features]
guest = ["leptoskit_bridge/guest"]

[dependencies]
leptoskit_bridge.workspace = true
thiserror.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
regex.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "time", "rt", "sync", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
