[package]
name = "leptoskit_l10n"
version.workspace = true
authors.workspace = true
categories = ["internationalization", "localization", "gui", "web-programming"]
edition.workspace = true
homepage.workspace = true
keywords = ["leptos", "i18n", "l10n", "translations", "leptoskit"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Typed translations for leptoskit in the style of Flutter's gen_l10n: locales, negotiation, and plural rules behind the generated messages module."

[dependencies]
intl_pluralrules = { workspace = true }
reactive_graph = { workspace = true }
thiserror = { workspace = true }
unic-langid = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["Navigator", "Window"] }

[dev-dependencies]
leptoskit_l10n_codegen = { workspace = true }

[features]
default = []
# Read the browser's preferred languages from `navigator.languages`. Only
# takes effect in wasm builds that run in a browser.
web = ["dep:js-sys", "dep:web-sys"]

[lints]
workspace = true
