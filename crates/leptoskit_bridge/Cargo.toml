[package]
name = "leptoskit_bridge"
version = "0.1.1"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Bounded binary calls and events between LeptosKit guests and native plugins."

[features]
guest = []
async-host = ["dep:tokio-util"]
# Records every call's timeline for leptoskit's devtools; see `devtools`.
devtools = ["dep:leptoskit_devtools_protocol"]

[dependencies]
bytes = { workspace = true }
leptoskit_devtools_protocol = { workspace = true, optional = true }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio-util = { version = "0.7", features = ["rt"], optional = true }

[lints]
workspace = true
