[package]
name = "leptoskit_plugin_secure_store"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Small secrets in platform credential stores for LeptosKit."

[package.metadata.leptoskit.runtime]
name = "secure-store"
apple-module = "LeptosKitSecureStore"
apple-type = "SecureStorePlugin"
android-type = "dev.leptoskit.plugins.securestore.SecureStorePlugin"
android-context = true

[features]
guest = ["leptoskit_bridge/guest"]
async-storage = [
	"dep:leptoskit_use",
	"dep:serde",
	"dep:serde_json",
	"dep:sha2",
	"dep:thiserror",
]

[dependencies]
leptoskit_bridge = { workspace = true }
leptoskit_use = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dev-dependencies]
futures = { workspace = true }
reactive_graph = { workspace = true }

[lints]
workspace = true
