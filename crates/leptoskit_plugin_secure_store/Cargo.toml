[package]
name = "leptoskit_plugin_secure_store"
version = "0.1.1"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Small secrets in platform credential stores for LeptosKit."

[package.metadata.leptoskit.runtime]
name = "secure-store"
apple-module = "LeptosKitSecureStore"
apple-type = "SecureStorePlugin"
android-type = "dev.leptoskit.plugins.securestore.SecureStorePlugin"
android-context = true

[features]
guest = ["leptoskit_bridge/guest"]

[dependencies]
leptoskit_bridge = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[lints]
workspace = true
