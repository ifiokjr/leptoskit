[package]
name = "leptoskit_use"
version.workspace = true
authors.workspace = true
build = "build.rs"
categories = ["gui", "web-programming"]
documentation = "https://docs.rs/leptoskit_use"
edition.workspace = true
homepage.workspace = true
keywords = ["leptos", "hooks", "reactive", "cross-platform"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version = "1.88"
description = "Cross-platform reactive primitives for Leptos, inspired by leptos-use."

[dependencies]
futures = { workspace = true }
leptoskit_plugin_posture = { workspace = true }
parking_lot = { workspace = true }
reactive_graph = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blocking = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["Storage", "Window", "Event", "EventTarget", "MediaQueryList", "MediaQueryListEvent"] }

[dev-dependencies]
leptoskit_native = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
js-sys = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
leptoskit_native = { workspace = true, features = ["web"] }
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = ["CustomEvent", "Document", "HtmlElement"] }

[features]
default = []
local-storage = [
	"dep:serde",
	"dep:serde_json",
	"dep:blocking",
	"dep:sha2",
	"dep:tempfile",
	"dep:wasm-bindgen",
	"dep:web-sys",
]
# Browser-only hooks over DOM and media APIs.
web = ["dep:js-sys", "dep:wasm-bindgen", "dep:web-sys"]
# Call syntax for signals. Requires a nightly compiler; a no-op on stable.
nightly = ["reactive_graph/nightly"]

[build-dependencies]
rustc_version = { workspace = true }

[lints]
workspace = true
