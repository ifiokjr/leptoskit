[package]
name = "leptoskit_windows"
version = "0.1.1"
authors.workspace = true
categories = ["gui", "os::windows-apis", "rendering"]
edition.workspace = true
homepage.workspace = true
keywords = ["windows", "win32", "native", "renderer", "leptos"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "The leptoskit Win32 backend: shared elements rendered as native Windows controls."

[target.'cfg(target_os = "windows")'.dependencies]
leptoskit_native = { workspace = true }
leptoskit_yoga = { workspace = true }
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
windows-core = "0.61"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
leptoskit_native = { workspace = true, features = ["rive"] }
leptoskit_rive = { workspace = true }

[lints]
workspace = true
