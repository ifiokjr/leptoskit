[package]
name = "leptoskit_fns"
version.workspace = true
authors.workspace = true
categories = ["web-programming", "gui"]
edition.workspace = true
homepage.workspace = true
keywords = ["leptos", "server", "functions", "leptoskit"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "An ergonomic API over leptos server functions: retry policies, error classification, reactive queries and mutations, and publishing the RPC to generated clients."

[dependencies]
axum = { workspace = true, optional = true }
http = { workspace = true, optional = true }
inventory = { workspace = true, optional = true }
leptos = { workspace = true }
leptoskit_fns_codegen = { workspace = true, optional = true, features = [] }
leptoskit_fns_macros = { workspace = true }
schemars = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures = { workspace = true }

[dev-dependencies]
http = { workspace = true }
insta = { workspace = true, features = ["json"] }
leptos = { workspace = true, features = ["csr", "ssr"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
wasm-bindgen-test = { workspace = true }

[features]
default = []
# Call syntax for queries and mutations. Requires a nightly compiler; a no-op
# on stable.
nightly = ["leptos/nightly"]
# The server side of `#[api]`: registers the function descriptions and exports
# the spec. Enable it from the app's own `ssr` feature, next to `leptos/ssr`.
ssr = [
	"leptoskit_fns_macros/ssr",
	"dep:http",
	"dep:inventory",
	"dep:leptoskit_fns_codegen",
	"dep:schemars",
	"dep:serde_json",
	"dep:thiserror",
]
# Serves the spec as OpenAPI from an axum router.
axum = ["ssr", "dep:axum"]

[lints]
workspace = true
