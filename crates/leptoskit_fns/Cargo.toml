[package]
name = "leptoskit_fns"
version.workspace = true
authors.workspace = true
categories = ["web-programming", "gui"]
edition.workspace = true
homepage.workspace = true
keywords = ["leptos", "server", "functions", "leptoskit"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "An ergonomic API over leptos server functions with retry policies, error classification, and reactive queries and mutations."

[dependencies]
leptos = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures = { workspace = true }

[dev-dependencies]
leptos = { workspace = true, features = ["csr"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wasm-bindgen-test = { workspace = true }

[features]
# Call syntax for queries and mutations. Requires a nightly compiler; a no-op
# on stable.
nightly = ["leptos/nightly"]

[lints]
workspace = true
