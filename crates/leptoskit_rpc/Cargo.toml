[package]
name = "leptoskit_rpc"
version.workspace = true
authors.workspace = true
categories = ["web-programming", "gui"]
edition.workspace = true
homepage.workspace = true
keywords = ["leptos", "server", "functions", "leptoskit"]
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "The app's operations: leptos server functions with retries and error classification, queries and mutations that run on the database, one client for every platform, and publishing it all to generated clients."

[dependencies]
any_spawner = { workspace = true }
axum = { workspace = true, optional = true, features = ["ws"] }
chrono = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
# The secret in a server-sent events connection's name.
getrandom = { workspace = true, optional = true }
http = { workspace = true, optional = true }
inventory = { workspace = true, optional = true }
leptos = { workspace = true }
leptoskit_config = { workspace = true, optional = true }
leptoskit_db = { workspace = true, optional = true }
leptoskit_devtools_protocol = { workspace = true, optional = true }
# The retry backoff timer, which covers every host leptoskit_query does, and
# the cache the client's queries and mutations live in.
leptoskit_query = { workspace = true }
leptoskit_rpc_codegen = { workspace = true, optional = true, features = [] }
leptoskit_rpc_macros = { workspace = true }
# Operations' argument structs serialize and describe themselves on every
# target, so these are always on.
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Only the browser and guest clients open sockets, and both are wasm-only.
leptoskit_plugin_websocket = { workspace = true, optional = true, default-features = false }
leptoskit_bridge = { workspace = true, optional = true }
leptoskit_plugin_crypto = { path = "../leptoskit_plugin_crypto", version = "0.1.0", optional = true, features = ["guest"] }
leptoskit_plugin_http = { path = "../leptoskit_plugin_http", version = "0.1.0", optional = true, default-features = false, features = ["guest"] }
# Where a native app keeps the offline queue between runs.
leptoskit_plugin_store = { workspace = true, optional = true, features = ["guest"] }
send_wrapper = { workspace = true, optional = true, features = ["futures"] }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["Crypto", "Event", "EventSource", "Headers", "Location", "MessageEvent", "Request", "RequestCredentials", "RequestInit", "RequestMode", "Response", "Storage", "Window"] }

[dev-dependencies]
any_spawner = { workspace = true, features = ["tokio"] }
axum = { workspace = true, features = ["tokio"] }
futures = { workspace = true, features = ["executor"] }
http = { workspace = true }
http-body-util = "0.1"
insta = { workspace = true, features = ["json"] }
leptos = { workspace = true, features = ["csr", "ssr"] }
leptoskit_db = { workspace = true, features = ["postgres", "sqlite"] }
# The live SDK tests generate each language's client from the collected spec.
leptoskit_rpc_codegen = { workspace = true, features = ["generators"] }
parking_lot = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
tower = { workspace = true, features = ["util"] }
trybuild = { workspace = true }

[features]
default = ["browser"]
# Backoff timers in the browser: `setTimeout` through leptoskit_query.
browser = ["leptoskit_query/browser"]
# leptos's `nightly` feature, for its macro and renderer. Requires a nightly
# compiler; a no-op on stable.
nightly = ["leptos/nightly"]
# The server side of `#[api]`: registers the function descriptions and exports
# the spec. Enable it from the app's own `ssr` feature, next to `leptos/ssr`.
ssr = [
	"leptoskit_rpc_macros/ssr",
	"dep:http",
	"dep:inventory",
	"dep:leptoskit_rpc_codegen",
	"dep:thiserror",
]
# Serves the spec as OpenAPI from an axum router.
axum = ["ssr", "dep:axum"]
# The client: `client::call`, and the query and mutation scopes an app's
# screens use, the same on every platform. On its own it has no way to reach
# the server; `web`, `guest`, or `server` gives it one.
client = ["dep:futures"]
# The client in the browser: same-origin `fetch`.
web = [
	"client",
	"dep:leptoskit_plugin_websocket",
	"leptoskit_plugin_websocket/browser",
	"dep:send_wrapper",
	"dep:wasm-bindgen",
	"dep:wasm-bindgen-futures",
	"dep:web-sys",
]
# The client in a native app's Wasm guest: the HTTP plugin, and the crypto
# plugin for idempotency keys when the app has it.
guest = [
	"client",
	"dep:leptoskit_bridge",
	"dep:leptoskit_plugin_crypto",
	"dep:leptoskit_plugin_http",
	"dep:leptoskit_plugin_store",
	"dep:leptoskit_plugin_websocket",
	"leptoskit_plugin_websocket/guest",
	"dep:send_wrapper",
]
# The server: the bodies of `#[rpc::query]` and `#[rpc::mutation]`, the
# registry of operations, and the `POST /api/<name>` routes. The client calls
# operations in process while the server renders.
server = ["axum", "client", "leptoskit_rpc_macros/server", "dep:tokio"]
# Queries and mutations over `leptoskit_db`: their contexts, `Identify`, and
# the `rpc` schema pack's receipts. Pick a driver with `postgres` or `sqlite`.
db = ["server", "dep:chrono", "dep:leptoskit_config", "dep:leptoskit_db", "leptoskit_db/server", "dep:sha2"]
# Runs operations on Postgres.
postgres = ["db", "leptoskit_db/postgres"]
# Runs operations on SQLite.
sqlite = ["db", "leptoskit_db/sqlite"]
# Records every retrying call's attempts for leptoskit's devtools; see
# `devtools`.
devtools = ["dep:leptoskit_devtools_protocol"]
# Serves live queries over a WebSocket at `/live`, and over server-sent events
# at `/live/events` where a socket can't get through, on top of the database's
# change feed. Pick a driver with `postgres` or `sqlite`.
live = ["server", "db", "dep:futures", "dep:getrandom"]

[lints]
workspace = true
