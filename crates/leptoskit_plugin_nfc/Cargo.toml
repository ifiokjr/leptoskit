[package]
name = "leptoskit_plugin_nfc"
version = "0.3.0"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
rust-version.workspace = true
description = "Bounded one-shot NDEF reads for LeptosKit."

[package.metadata.leptoskit.runtime]
name = "nfc"
apple-module = "LeptosKitNfc"
apple-type = "NfcPlugin"
apple-usage-descriptions = ["NFCReaderUsageDescription"]
android-type = "dev.leptoskit.plugins.nfc.NfcPlugin"
android-context = true
android-permissions = ["android.permission.NFC"]

[package.metadata.leptoskit.runtime.macos]
unavailable = true

[package.metadata.leptoskit.runtime.windows]
unavailable = true

[package.metadata.leptoskit.runtime.linux]
unavailable = true

[package.metadata.leptoskit.runtime.tui]
unavailable = true

[features]
guest = ["leptoskit_bridge/guest"]

[dependencies]
leptoskit_bridge = { workspace = true }

[lints]
workspace = true
