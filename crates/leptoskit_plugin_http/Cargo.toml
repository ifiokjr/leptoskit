[package]
name = "leptoskit_plugin_http"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Scoped, bounded asynchronous HTTP requests for LeptosKit hosts and browsers."

[dependencies]
thiserror = { workspace = true }
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "time", "sync"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
futures = { workspace = true }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["Window", "Location", "AbortController", "AbortSignal", "Request", "RequestInit", "RequestMode", "RequestRedirect", "RequestCredentials", "Headers", "Response", "ReadableStream", "ReadableStreamDefaultReader"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lints]
workspace = true
