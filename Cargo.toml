[workspace]
members = ["crates/*", "examples/*"]
default-members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Ifiok Jr. <ifiokotung@gmail.com>"]
edition = "2024"
homepage = "https://github.com/ifiokjr/leptoskit"
license = "Unlicense"
repository = "https://github.com/ifiokjr/leptoskit"
rust-version = "1.86.0"

[workspace.dependencies]
any_spawner = "0.2"
anyhow = "1"
axum = "0.8"
brotli = "8"
bytes = "1"
camino = "1"
cfg-if = "1"
chrono = "0.4"
clap = "4"
clap_complete = "4"
codee = "0.3"
console_error_panic_hook = "0.1"
darling = "0.20"
derive_more = "2"
ed25519-dalek = "3"
flate2 = "1"
futures = "0.3"
getrandom = "0.4"
hex = "0.4"
http = "1"
hydration_context = "0.3"
hyper = "1"
ignore = "0.4"
indexmap = "2"
insta = "1"
leptos = "0.8.0-beta"
leptos-use = { git = "https://github.com/Synphonyte/leptos-use", rev = "91021a0" }
leptos_axum = "0.8"
leptos_config = "0.8.0-beta"
leptos_meta = "0.8.0-beta"
leptos_router = "0.8.0-beta"
libtest-mimic = "0.8"
notify = "8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false }
objc2-core-foundation = { version = "0.3", default-features = false }
objc2-core-graphics = { version = "0.3", default-features = false }
objc2-foundation = { version = "0.3", default-features = false }
objc2-quartz-core = { version = "0.3", default-features = false }
once_cell = "1"
parking_lot = "0.12"
paste = "1"
playwright = "0.0.20"
proc-macro2 = "1"
quote = "1"
rayon = "1"
reactive_graph = "0.2.16"
regex = "1"
rstest = "0.25"
semver = { version = "1", features = ["serde"] }
send_wrapper = "0.6"
serde = "1"
serde_json = "1"
sha2 = "0.10"
smallvec = "1"
syn = "2"
thiserror = "2"
tokio = "1"
toml = "0.9"
tower = "0.5"
tower-http = "0.6"
typed-builder = "0.20"
walkdir = "2"
wasm-bindgen = "0.2"
wasm-bindgen-cli-support = "0.2"
wasm-bindgen-shared = "=0.2.129"
wasm-bindgen-test = "0.3"
wasm_split_cli_support = "0.2.4"
wasmi = "2"
wasmparser = "0.261"
web-sys = "0.3"

# internal
leptos_testing_library = { path = "crates/leptos_testing_library", version = "0.1.0" }
leptoskit = { path = "crates/leptoskit", version = "0.1.0" }
leptoskit_appkit = { path = "crates/leptoskit_appkit", version = "0.1.0" }
leptoskit_axum = { path = "crates/leptoskit_axum", version = "0.1.0" }
leptoskit_cli = { path = "crates/leptoskit_cli", version = "0.1.0" }
leptoskit_codepush = { path = "crates/leptoskit_codepush", version = "0.1.0" }
leptoskit_config = { path = "crates/leptoskit_config", version = "0.1.0" }
leptoskit_fns = { path = "crates/leptoskit_fns", version = "0.1.0" }
leptoskit_native = { path = "crates/leptoskit_native", version = "0.1.0" }
leptoskit_plugin = { path = "crates/leptoskit_plugin", version = "0.1.0" }
leptoskit_use = { path = "crates/leptoskit_use", version = "0.1.0" }
leptoskit_wasm = { path = "crates/leptoskit_wasm", version = "0.1.0" }
leptoskit_yoga = { path = "crates/leptoskit_yoga", version = "0.1.0" }

# leptos view types give the islands example symbol names long enough to
# overflow an MSVC PDB (LNK4319) in debug builds. It needs no debugger, so
# its debug build skips debug info and the PDB (`strip` passes /DEBUG:NONE).
[profile.dev.package.islands_example]
debug = false
strip = "debuginfo"

# Distribution profile for release builds.
# Use `cargo build --profile dist` for optimized, stripped binaries.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = "symbols"

[workspace.metadata.bin]
cargo-insta = { version = "1.42.2" }
cargo-llvm-cov = { version = "0.6.16" }
cargo-semver-checks = { version = "0.40.0" }
leptosfmt = { git = "https://github.com/bram209/leptosfmt", rev = "453618e", version = "0.1.33", bins = ["leptosfmt"] }
mdbook = { version = "0.5.2" }
wasm-bindgen-cli = { version = "0.2.129", bins = ["wasm-bindgen", "wasm-bindgen-test-runner"] }

[workspace.lints.rust]
# Group lints
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }

# Individual lints
unsafe_code = "deny"
unstable_features = "deny"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
# Group lints
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Individual lints
blocks_in_conditions = "allow"
cargo_common_metadata = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
expl_impl_clone_on_copy = "allow"
items_after_statements = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
no_effect_underscore_binding = "allow"
tabs-in-doc-comments = "allow"
too_many_lines = "allow"
wildcard_dependencies = "deny"
wildcard_imports = "allow"
