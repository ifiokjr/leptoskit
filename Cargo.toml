[workspace]
members = [
	"benchmarks/native",
	"benchmarks/native/counter",
	"benchmarks/native/guest",
	"crates/*",
	"crates/leptoskit_db/tests/client_fixture",
	"crates/leptoskit_db/tests/pack_fixture",
	"docs/site",
	"examples/*",
	"examples/gallery/verify",
	"setup/android_apk",
	"setup/coverage_gate",
	"setup/harmonyos_plugins",
]
default-members = ["crates/*"]
resolver = "2"
# file_routes and commonplace are standalone workspaces in the scaffold's
# shape, and opencode's terminal runner is a generated runner: all compile
# only after `leptoskit build` generates `.leptoskit/`, so none can join this
# repository's workspace.
exclude = ["examples/commonplace", "examples/file_routes", "examples/opencode/tui"]

[workspace.package]
version = "0.1.0"
authors = ["Ifiok Jr. <ifiokotung@gmail.com>"]
edition = "2024"
homepage = "https://ifiokjr.github.io/leptoskit/"
license = "Unlicense"
repository = "https://github.com/ifiokjr/leptoskit"
# Rust 1.95 stabilized the atomics' `try_update` and `if let` match guards,
# which wasm-split needs inside the CLI.
rust-version = "1.95.0"

[workspace.dependencies]
anstream = "1"
