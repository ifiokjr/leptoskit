[workspace]
members = [
	"benchmarks/native",
	"benchmarks/native/guest",
	"crates/*",
	"examples/*",
	"examples/gallery/verify",
	"setup/android_apk",
	"setup/coverage_gate",
]
default-members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Ifiok Jr. <ifiokotung@gmail.com>"]
edition = "2024"
homepage = "https://github.com/ifiokjr/leptoskit"
license = "Unlicense"
repository = "https://github.com/ifiokjr/leptoskit"
rust-version = "1.86.0"

[workspace.dependencies]
any_spawner = "0.3"
anyhow = "1"
arborium = { version = "2.18", default-features = false }
axum = "0.8"
base64 = "0.22"
blocking = "1.6"
brotli = "8"
bytes = "1"
camino = "1"
cfg-if = "1"
chrono = "0.4"
clap = "4"
clap_complete = "4"
codee = "0.3"
console_error_panic_hook = "0.1"
convert_case = "0.11"
darling = "0.20"
derive_more = "2"
ed25519-dalek = "3"
flate2 = "1"
futures = "0.3"
getrandom = "0.4"
heck = "0.5"
hex = "0.4"
http = "1"
hydration_context = "0.3"
hyper = "1"
ignore = "0.4"
indexmap = "2"
insta = "1"
inventory = "0.3"
js-sys = "0.3"
leptos = "0.8.0-beta"
leptos-use = { git = "https://github.com/Synphonyte/leptos-use", rev = "91021a0" }
leptos_axum = "0.8"
leptos_config = "0.8.0-beta"
leptos_meta = "0.8.0-beta"
leptos_router = "0.8.0-beta"
libtest-mimic = "0.8"
markdown = "1"
notify = "8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false }
objc2-core-foundation = { version = "0.3", default-features = false }
objc2-core-graphics = { version = "0.3", default-features = false }
objc2-foundation = { version = "0.3", default-features = false }
objc2-quartz-core = { version = "0.3", default-features = false }
once_cell = "1"
parking_lot = "0.12"
paste = "1"
playwright = "0.0.20"
png = "0.17"
prettyplease = "0.3"
proc-macro2 = "1"
proc-macro2-diagnostics = { version = "0.11", default-features = false }
quote = "1"
rayon = "1"
reactive_graph = "0.2.16"
regex = "1"
reqwest = { version = "0.12", default-features = false }
rquickjs = "0.14"
rstest = "0.25"
rstml = "0.13"
rustc_version = "0.4"
rustix = "1"
rusty-s3 = { version = "0.10", default-features = false }
schemars = { version = "1.2", features = ["semver1"] }
semver = { version = "1", features = ["serde"] }
send_wrapper = "0.6"
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
smallvec = "1"
syn = "3"
tempfile = "3"
thiserror = "2"
tokio = "1"
toml = "0.9"
toml_edit = "0.25"
tower = "0.5"
tower-http = "0.6"
trybuild = "1"
typed-builder = "0.20"
ureq = { version = "3", default-features = false }
url = "2"
walkdir = "2"
