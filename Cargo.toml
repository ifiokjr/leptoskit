leptoskit = { path = "crates/leptoskit", version = "0.1.0" }
leptoskit_android = { path = "crates/leptoskit_android", version = "0.1.0" }
leptoskit_appkit = { path = "crates/leptoskit_appkit", version = "0.1.0" }
leptoskit_axum = { path = "crates/leptoskit_axum", version = "0.1.0" }
leptoskit_bridge = { path = "crates/leptoskit_bridge", version = "0.1.0" }
leptoskit_cli = { path = "crates/leptoskit_cli", version = "0.1.0" }
leptoskit_codepush = { path = "crates/leptoskit_codepush", version = "0.1.0" }
leptoskit_config = { path = "crates/leptoskit_config", version = "0.1.0" }
leptoskit_docs = { path = "crates/leptoskit_docs", version = "0.1.0" }
leptoskit_fmt = { path = "crates/leptoskit_fmt", version = "0.1.0" }
leptoskit_fns = { path = "crates/leptoskit_fns", version = "0.1.0" }
leptoskit_fns_codegen = { path = "crates/leptoskit_fns_codegen", version = "0.1.0", default-features = false }
leptoskit_fns_macros = { path = "crates/leptoskit_fns_macros", version = "0.1.0" }
leptoskit_gtk = { path = "crates/leptoskit_gtk", version = "0.1.0" }
leptoskit_macros = { path = "crates/leptoskit_macros", version = "0.1.0" }
leptoskit_native = { path = "crates/leptoskit_native", version = "0.1.0" }
leptoskit_plugin = { path = "crates/leptoskit_plugin", version = "0.1.0" }
leptoskit_plugin_filesystem = { path = "crates/leptoskit_plugin_filesystem", version = "0.1.0" }
leptoskit_plugin_menu = { path = "crates/leptoskit_plugin_menu", version = "0.1.0" }
leptoskit_query = { path = "crates/leptoskit_query", version = "0.1.0" }
leptoskit_router = { path = "crates/leptoskit_router", version = "0.1.0" }
leptoskit_router_codegen = { path = "crates/leptoskit_router_codegen", version = "0.1.0" }
leptoskit_router_macros = { path = "crates/leptoskit_router_macros", version = "0.1.0" }
leptoskit_sensor = { path = "crates/leptoskit_sensor", version = "0.1.0" }
leptoskit_testing = { path = "crates/leptoskit_testing", version = "0.1.0" }
leptoskit_uikit = { path = "crates/leptoskit_uikit", version = "0.1.0" }
leptoskit_use = { path = "crates/leptoskit_use", version = "0.1.0" }
leptoskit_wasm = { path = "crates/leptoskit_wasm", version = "0.1.0" }
leptoskit_windows = { path = "crates/leptoskit_windows", version = "0.1.0" }
leptoskit_yoga = { path = "crates/leptoskit_yoga", version = "0.1.0" }

# Distribution profile for release builds.
# Use `cargo build --profile dist` for optimized, stripped binaries.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = "symbols"

[workspace.metadata.bin]
cargo-insta = { version = "1.42.2" }
cargo-llvm-cov = { version = "0.6.16" }
cargo-semver-checks = { version = "0.40.0" }
mdbook = { version = "0.5.2" }
wasm-bindgen-cli = { version = "0.2.129", bins = ["wasm-bindgen", "wasm-bindgen-test-runner"] }

[workspace.lints.rust]
# Group lints
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }

# Individual lints
unsafe_code = "deny"
unstable_features = "deny"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

# Set by build scripts when the compiler is a nightly build; gates the
# `nightly` cargo feature's nightly-only impls.
[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(rustc_nightly)"]

[workspace.lints.clippy]
# Group lints
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Individual lints
blocks_in_conditions = "allow"
cargo_common_metadata = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
expl_impl_clone_on_copy = "allow"
items_after_statements = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
no_effect_underscore_binding = "allow"
tabs-in-doc-comments = "allow"
too_many_lines = "allow"
wildcard_dependencies = "deny"
wildcard_imports = "allow"
