# Distribution profile for release builds.
# Use `cargo build --profile dist` for optimized, stripped binaries.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = "symbols"

[workspace.metadata.bin]
cargo-insta = { version = "1.42.2" }
cargo-llvm-cov = { version = "0.9.1" }
cargo-semver-checks = { version = "0.40.0" }
wasm-bindgen-cli = { version = "0.2.129", bins = ["wasm-bindgen", "wasm-bindgen-test-runner"] }

[workspace.lints.rust]
# Group lints
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }

# Individual lints
unsafe_code = "deny"
unstable_features = "deny"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

# Every publishable crate is declared in `[workspace.dependencies]`, so members
# name internal crates with `workspace = true`, whether or not a member uses
# one yet.
[workspace.lints.cargo]
unused_workspace_dependencies = "allow"

[workspace.lints.clippy]
# Group lints
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Individual lints
blocks_in_conditions = "allow"
cargo_common_metadata = "allow"
# Readability floors, with thresholds in `clippy.toml`: cognitive complexity
# is in the restriction group, and excessive nesting is inert without its
# threshold.
cognitive_complexity = "warn"
excessive_nesting = "warn"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
expl_impl_clone_on_copy = "allow"
items_after_statements = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
no_effect_underscore_binding = "allow"
tabs_in_doc_comments = "allow"
wildcard_dependencies = "deny"
wildcard_imports = "allow"
