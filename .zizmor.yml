# zizmor configuration.
#
# The `self-repository` audit wants `owner/repo@ref` action references, but
# `./.github/actions/devenv` and `./.github/actions/rust` are intentional local
# composite actions: they always match the checkout on the same commit without
# a ref round trip.
rules:
  self-repository:
    ignore:
      - ci.yml
      - benchmarks.yml
      - docs.yml
      - publish.yml
      - release.yml
