# cargo-deny configuration.
#
# Checks advisories, licenses, and bans. See https://embarkstudios.github.io/cargo-deny/.

[graph]
targets = [
	{ triple = "x86_64-unknown-linux-gnu" },
	{ triple = "aarch64-apple-darwin" },
	{ triple = "x86_64-pc-windows-msvc" },
	{ triple = "wasm32-unknown-unknown" },
]

[advisories]
# Deny a dependency with a known advisory rather than warning, because the tool ships to users.
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
	# `paste` is unmaintained but harmless (a compile-time macro) and arrives
	# transitively through the leptos 0.8 beta toolchain.
	{ id = "RUSTSEC-2024-0436", reason = "transitive via leptos 0.8-beta; compile-time macro only" },
	# `proc-macro-error2` is the community fork of proc-macro-error and arrives
	# transitively through rstml in the leptos macro stack.
	{ id = "RUSTSEC-2026-0173", reason = "transitive via rstml/leptos macros; the maintained fork of proc-macro-error" },
	# webpki-roots 0.26.11 is the semver-trick release that re-exports
	# webpki-roots 1.x; tokio-tungstenite 0.30 still names 0.26. The lockfile
	# resolves 1.x to a fixed release (>= 1.0.10), so the distrusted roots are
	# not compiled in. Drop this once tokio-tungstenite depends on 1.x.
	{ id = "RUSTSEC-2026-0381", reason = "0.26.11 re-exports the locked webpki-roots >= 1.0.10, which removes the distrusted roots" },
	# zbus 6 absorbed zvariant, zvariant_derive and zbus_names, so the standalone
	# crates are unmaintained rather than vulnerable. They arrive through ksni 0.3
	# (the Linux tray backend), whose latest release still depends on zbus 5.
	# Drop these once ksni moves to zbus 6.
	{ id = "RUSTSEC-2026-0370", reason = "zvariant via ksni 0.3 / zbus 5; merged into zbus 6, which ksni has not adopted" },
	{ id = "RUSTSEC-2026-0371", reason = "zbus_names via ksni 0.3 / zbus 5; merged into zbus 6, which ksni has not adopted" },
	{ id = "RUSTSEC-2026-0372", reason = "zvariant_derive via ksni 0.3 / zbus 5; merged into zbus 6, which ksni has not adopted" },
]

[licenses]
# Only permissive licenses, so the binary can be redistributed without a legal review.
allow = [
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"BSL-1.0",
	"CC0-1.0",
	# The Mozilla CA root bundle in `webpki-roots`, which `codepush publish`
	# and the native UI driver's HTTPS client use to verify TLS endpoints:
	# attribution only, no copyleft.
	"CDLA-Permissive-2.0",
	"ISC",
	"MIT",
	"MPL-2.0",
	"Unicode-3.0",
	"Unlicense",
	"Zlib",
]
confidence-threshold = 0.8

# Mozilla's trust-anchor data uses a permissive data license, rather than a
# software license. Keep the exception scoped to the TLS root-certificate crate.
[[licenses.exceptions]]
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies of private crates, and path-only dev-dependencies, which
# cargo strips on publish, are not wildcards: `setup/android_apk` is a private
# host tool that `leptoskit_android`'s device verifier builds with.
allow-wildcard-paths = true

# Dependencies that must not appear in the graph, with the reason.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# `leptos-use` tracks an unreleased commit of the 0.8 beta line.
allow-git = ["https://github.com/Synphonyte/leptos-use"]
