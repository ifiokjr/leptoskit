[package]
name = "tablebench_client"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
csr = ["leptos/csr"]

[dependencies]
# The same leptos as the leptoskit fixture. wasm-bindgen differs by
# necessity: wasm-bindgen only accepts modules built against its own schema,
# and cargo-leptos 0.3.6 embeds 0.2.128 where the leptoskit CLI embeds
# 0.2.100. Each tool binds the app with the bindgen it ships.
leptos = "=0.8.14"
wasm-bindgen = "=0.2.128"
