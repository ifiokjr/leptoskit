[package]
name = "arena_windows"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "leptoskit_app"
crate-type = ["staticlib"]

[target.'cfg(target_os = "windows")'.dependencies]
leptoskit_bridge_ffi = { version = "=0.1.0", default-features = false, path = "../../../../../crates/leptoskit_bridge_ffi", features = ["app"] }
leptoskit = { version = "=0.1.0", default-features = false, path = "../../../../../crates/leptoskit", features = ["wasm", "windows"] }

[[bin]]
name = "arena-windows"
path = "src/main.rs"
