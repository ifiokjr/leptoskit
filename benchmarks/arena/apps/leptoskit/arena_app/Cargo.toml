[package]
name = "arena_app"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
web = [
	"leptoskit/web",
	"dep:leptos",
	"dep:wasm-bindgen",
	"dep:wasm-bindgen-futures",
	"dep:web-sys",
	"dep:js-sys",
]
native = [
	"leptoskit/guest",
	"dep:leptoskit_bridge",
	"arena_bridge/guest",
	"arena_clock/guest",
	"dep:futures",
]
ios = ["native", "leptoskit/ios"]
android = ["native", "leptoskit/android"]
macos = ["native", "leptoskit/macos"]
windows = ["native", "leptoskit/windows"]
linux = ["native", "leptoskit/linux"]
csr = ["web", "leptos/csr"]
hydrate = ["web", "leptos/hydrate"]
ssr = ["web", "leptos/ssr"]

[dependencies]
arena_bridge = { path = "../plugins/arena_bridge" }
arena_clock = { path = "../plugins/arena_clock" }
arena_shared = { path = "../arena_shared" }
futures = { version = "0.3", default-features = false, features = ["executor"], optional = true }
js-sys = { version = "0.3", optional = true }
leptos = { version = "0.9.0-rc0", default-features = false, optional = true }
leptoskit = { version = "=0.1.0", default-features = false, path = "../../../../../crates/leptoskit" }
leptoskit_bridge = { version = "=0.1.0", path = "../../../../../crates/leptoskit_bridge", optional = true }
serde_json = "1"
# The embedded wasm-bindgen CLI accepts exactly its matching library version.
wasm-bindgen = { version = "=0.2.129", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["Location", "Performance", "UrlSearchParams", "Window", "console"], optional = true }

[build-dependencies]
leptoskit_build = { version = "=0.1.0", default-features = false, path = "../../../../../crates/leptoskit_build" }
