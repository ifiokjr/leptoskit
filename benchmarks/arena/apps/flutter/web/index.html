<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Flutter app of the leptoskit arena benchmark.">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Arena Flutter</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // ArenaEcho for the `echo` scenario. The browser's platform language is
    // JavaScript, so the module lives here: the async tier awaits a Promise,
    // and the sync tier calls the same functions synchronously.
    globalThis.ArenaEcho = {
      echo: (value) => Promise.resolve(value),
      addOne: (value) => Promise.resolve(value + 1),
      echoSync: (value) => value,
      addOneSync: (value) => value + 1,
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
