[package]
name = "huddle"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description = "Huddle's server: the website, sign-in, the live socket, and the job workers, in one binary."

# The package is the app (`app.name` in leptoskit.toml), so its binary is
# `huddle`; the library, which the tests start in process, is `huddle_server`.
[lib]
name = "huddle_server"

[dependencies]
huddle_api = { path = "../huddle_api", features = ["server"] }
huddle_db = { path = "../huddle_db", features = ["server", "postgres"] }
leptoskit = { workspace = true, features = ["server", "db-sqlite", "db-postgres", "auth", "rpc-relay"] }
leptoskit_auth = { workspace = true, features = ["axum", "sqlite", "postgres", "rpc"] }
leptoskit_config = { workspace = true }
leptoskit_rpc = { workspace = true, features = ["relay", "sqlite", "postgres"] }
serde_json = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
leptoskit_db = { workspace = true, features = ["sqlite"] }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }

[lints]
workspace = true
