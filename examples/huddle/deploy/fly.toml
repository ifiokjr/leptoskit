# huddle on Fly.io, written by `leptoskit generate deploy`. It's yours to
# edit: running the generator again keeps your changes unless you pass
# --force. From the repository root, create the app from it, then deploy:
#
#   fly launch --config examples/huddle/deploy/fly.toml --copy-config --no-deploy
#   fly volumes create data --size 1 --config examples/huddle/deploy/fly.toml
#   fly secrets set AUTH_ENCRYPTION_KEYS=... --config examples/huddle/deploy/fly.toml
#   fly deploy --config examples/huddle/deploy/fly.toml --dockerfile examples/huddle/deploy/Dockerfile
#
# Pick your own app name: Fly's are global.

app = "huddle-demo"

# On SIGTERM the server fails /readyz, waits 5 seconds for the proxy to
# notice, and gives the requests in flight 20 more. Fly kills it after this.
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
dockerfile = "Dockerfile"

[http_service]
internal_port = 3000
force_https = true
# Machines keep running. Fly stops a machine it thinks is idle, and that
# drops every WebSocket and streaming connection on it, so clients of an
# app that holds them would disconnect without warning. An app that only
# answers short requests can scale to zero instead, with
# auto_stop_machines = "stop" and min_machines_running = 0.
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

# The proxy sends traffic only to machines whose /readyz answers 200.
[[http_service.checks]]
grace_period = "30s"
interval = "10s"
timeout = "2s"
method = "GET"
path = "/readyz"

# The origin people open, for the session cookie and the live socket's
# Origin check, and the header Fly puts the client's address in, for
# sign-in's rate limits.
[env]
HUDDLE_ORIGIN = "https://huddle-demo.fly.dev"
HUDDLE_CLIENT_IP_HEADER = "fly-client-ip"

# The SQLite database lives on this volume. A volume belongs to one machine,
# so run one machine: `fly scale count 1`.
[mounts]
source = "data"
destination = "/data"
