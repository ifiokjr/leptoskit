[package]
name = "file_routes_example_linux"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "leptoskit_app"
crate-type = ["staticlib"]

[target.'cfg(target_os = "linux")'.dependencies]
leptoskit_bridge_ffi = { version = "=0.1.1", default-features = false, path = "../../../crates/leptoskit_bridge_ffi", features = ["app"] }
leptoskit = { version = "=0.1.1", default-features = false, path = "../../../crates/leptoskit", features = ["wasm", "gtk", "rive"] }

[[bin]]
name = "file-routes-example-linux"
path = "src/main.rs"

# The runner exports the generated registrant's C entry points, which are
# `unsafe` by nature, so it does not take the app's `unsafe_code` denial.
[lints.rust]
unsafe_code = "allow"
