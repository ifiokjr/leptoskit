#:schema https://ifiokjr.github.io/leptoskit/schemas/leptoskit.v0.schema.json

schema_version = 0

# Field runs everywhere: the browser through `leptoskit dev`, and the five
# native destinations through `leptoskit build --platform <platform>`.
[app]
name = "file_routes_example"
platforms = ["web", "ios", "android", "macos", "windows", "linux"]
render = "csr"

[build]
client_package = "file_routes_example"

[native]
package_id = "dev.leptoskit.field"

# The file router as a plugin: `leptoskit dev`, `build` and
# `plugin:router routes` regenerate `src/routes.rs` from `src/routes/`.
[[plugins]]
name = "router"
