[package]
name = "plugin_replies_probe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

# The guest compiles only for wasm32; the host build is an empty crate.
[target.'cfg(target_arch = "wasm32")'.dependencies]
leptoskit_bridge = { workspace = true, features = ["guest"] }
leptoskit_plugin_filesystem = { workspace = true, features = ["guest"] }
leptoskit_plugin_haptics = { path = "../../crates/leptoskit_plugin_haptics", version = "0.1.0", features = ["guest"] }
leptoskit_plugin_sqlite = { path = "../../crates/leptoskit_plugin_sqlite", version = "0.1.0", features = ["guest"] }

[lints]
workspace = true
