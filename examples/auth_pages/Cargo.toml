[package]
name = "auth_pages_example"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description = "The screens and routes `leptoskit generate auth --idp` writes, compiled and rendered headlessly so the templates can't drift from the hooks."

[dependencies]
leptoskit = { workspace = true, features = ["auth", "idp", "leptos", "query"] }
leptoskit_router = { workspace = true }

[dev-dependencies]
any_spawner = { workspace = true, features = ["tokio"] }
chrono = { workspace = true }
leptoskit_testing = { workspace = true }
reactive_graph = { workspace = true, features = ["effects"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
