[package]
name = "opencode_example"
version.workspace = true
authors.workspace = true
default-run = "opencode"
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description = "An opencode-style coding agent interface written once and rendered in the terminal and the browser."

[[bin]]
name = "opencode"
path = "src/bin/tui.rs"

[[bin]]
name = "opencode-web"
path = "src/bin/web.rs"
required-features = ["web"]

[dependencies]
leptos = { workspace = true, features = ["csr"], optional = true }
leptoskit = { workspace = true, features = ["tui"] }
leptoskit_native = { workspace = true }
leptoskit_tui = { workspace = true }
leptoskit_yoga = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["Document", "Element", "HtmlElement", "KeyboardEvent", "Window"] }

[features]
web = ["dep:leptos", "dep:web-sys", "dep:wasm-bindgen", "leptoskit/web"]

[dev-dependencies]
insta = { workspace = true }

[lints]
workspace = true
