[package]
name = "hooks_guest_probe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

# The guest compiles only for wasm32; the host build is an empty crate.
[target.'cfg(target_arch = "wasm32")'.dependencies]
leptoskit = { workspace = true, features = ["guest", "use"] }
reactive_graph = { workspace = true }

[lints]
workspace = true
