[package]
name = "commonplace_app"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
# The website: rendered in the browser by leptos, with the router following
# the address bar, and requests made with the page's own session cookie.
web = [
	"leptoskit/web",
	"leptoskit_router/web",
	"dep:leptos",
	"dep:wasm-bindgen",
	"dep:wasm-bindgen-futures",
	"dep:web-sys",
	"dep:js-sys",
]
csr = ["web", "leptos/csr"]
# The browser extension: the same screens in a popup, a side panel, the
# options page, a new tab page, and frames on other sites, with a background
# worker. `leptoskit build --platform extension` turns it on.
extension = ["csr", "leptoskit/extension"]
# The native apps: a Wasm guest drawing native widgets, reaching the server
# through the HTTP plugin and keeping its session in the secure store.
native = [
	"leptoskit/guest",
	"dep:leptoskit_plugin_http",
	"dep:leptoskit_plugin_secure_store",
	"dep:futures-executor",
]
# The DevTools agents, which `leptoskit dev` turns on.
devtools = ["leptoskit/devtools"]
ios = ["native", "leptoskit/ios"]
android = ["native", "leptoskit/android"]
macos = ["native", "leptoskit/macos"]

[dependencies]
commonplace_db = { path = "../commonplace_db" }
commonplace_shared = { path = "../commonplace_shared" }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
leptoskit = { version = "=0.1.0", default-features = false, path = "../../../crates/leptoskit" }
leptoskit_db = { version = "=0.1.0", default-features = false, path = "../../../crates/leptoskit_db" }
leptoskit_router = { version = "=0.1.0", path = "../../../crates/leptoskit_router" }
reactive_graph = "0.2.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

js-sys = { version = "0.3", optional = true }
leptos = { version = "0.9.0-rc0", default-features = false, optional = true }
# The embedded wasm-bindgen CLI accepts exactly its matching library version.
wasm-bindgen = { version = "=0.2.129", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Headers", "Request", "RequestCredentials", "RequestInit", "Response", "Window"] }

futures-executor = { version = "0.3", optional = true }
leptoskit_plugin_http = { version = "=0.1.0", default-features = false, path = "../../../crates/leptoskit_plugin_http", features = ["guest"], optional = true }
leptoskit_plugin_secure_store = { version = "=0.1.0", default-features = false, path = "../../../crates/leptoskit_plugin_secure_store", features = ["guest"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
commonplace_backend = { path = "../commonplace_backend" }
http-body-util = "0.1"
leptoskit = { version = "=0.1.0", default-features = false, path = "../../../crates/leptoskit", features = ["server", "db-sqlite", "auth"] }
leptoskit_testing = { version = "=0.1.0", path = "../../../crates/leptoskit_testing" }
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
leptoskit_build = { version = "=0.1.0", default-features = false, path = "../../../crates/leptoskit_build" }
