# :schema ./docs/src/schemas/monochange.schema.json

# =============================================================================
# monochange.toml — release configuration for leptoskit
# =============================================================================
#
# This file is the single source of truth for release planning, version bumps,
# changelog generation, and publishing. Run `monochange step validate` to check
# it against the workspace.

[defaults]
# Bump severity applied to transitive dependents when a dependency changes: a
# dependent compiled against a changed crate has to be rebuilt and re-released,
# but nothing about its own API changed.
bump_propagation = "patch"

# Whether private packages take part in discovery and release planning.
include_private = false

# Warn when version-group members drift apart. Every package in this repository
# is one product, so drift means the published set is inconsistent.
warn_on_group_mismatch = true

# Every package in this repository is a Cargo crate, so the default package
# type saves repeating `type = "cargo"` on every entry.
package_type = "cargo"

[defaults.changelog]
path = "{{ path }}/changelog.md"
format = "keep_a_changelog"
initial_header = """
# Changelog

All notable changes to this project are documented in this file.

The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and
this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

# =============================================================================
# Change files
# =============================================================================

[changesets]
# Change files live in a directory of their own rather than beside the code they
# describe. Every markdown file in this directory is parsed as a changeset, so
# it holds change files and nothing else.
directory = ".changeset"

# =============================================================================
# Version groups
# =============================================================================

# Every crate releases in lockstep. They are one product: a CLI whose version
# disagrees from the renderer it embeds would resolve a broken set, and a meta
# crate that re-exports mismatched versions is worse than no meta crate.
[group.release]
packages = [
	"leptos_testing_library",
	"leptoskit_yoga",
	"leptoskit_use",
	"leptoskit_native",
	"leptoskit_testing",
	"leptoskit_appkit",
	"leptoskit_config",
	"leptoskit_plugin",
	"leptoskit_bridge",
	"leptoskit_bridge_ffi",
	"leptoskit_plugin_crypto",
	"leptoskit_plugin_os",
	"leptoskit_plugin_clipboard",
	"leptoskit_plugin_haptics",
	"leptoskit_plugin_battery",
	"leptoskit_plugin_device",
	"leptoskit_plugin_secure_store",
	"leptoskit_plugin_linking",
	"leptoskit_plugin_filesystem",
	"leptoskit_plugin_network",
	"leptoskit_plugin_dialog",
	"leptoskit_plugin_document_picker",
	"leptoskit_plugin_screen_orientation",
	"leptoskit_plugin_light_sensor",
	"leptoskit_plugin_pedometer",
	"leptoskit_plugin_accelerometer",
	"leptoskit_plugin_application",
	"leptoskit_plugin_autostart",
	"leptoskit_plugin_barometer",
	"leptoskit_plugin_brightness",
	"leptoskit_plugin_gyroscope",
	"leptoskit_plugin_http",
	"leptoskit_plugin_keep_awake",
	"leptoskit_plugin_localization",
	"leptoskit_plugin_magnetometer",
	"leptoskit_plugin_permissions",
	"leptoskit_plugin_single_instance",
	"leptoskit_plugin_speech",
	"leptoskit_plugin_sqlite",
	"leptoskit_plugin_store",
	"leptoskit_plugin_image_manipulator",
	"leptoskit_plugin_screen_capture",
	"leptoskit_plugin_websocket",
	"leptoskit_plugin_arguments",
	"leptoskit_plugin_shell",
	"leptoskit_plugin_logging",
	"leptoskit_plugin_notifications",
	"leptoskit_plugin_local_authentication",
	"leptoskit_plugin_location",
	"leptoskit_plugin_global_shortcut",
	"leptoskit_plugin_window_state",
	"leptoskit_sensor",
	"leptoskit_codepush",
	"leptoskit_wasm",
	"leptoskit_axum",
	"leptoskit_fns",
	"leptoskit_query",
	"leptoskit_docs",
	"leptoskit_macros",
	"leptoskit_router_macros",
	"leptoskit_router",
	"leptoskit_router_codegen",
	"leptoskit_cli",
	"leptoskit_fmt",
	"leptoskit",
]
tag = true
release = true
# `primary` means one tag names the whole group. A tag per crate would
# make the releases page unreadable and give nothing extra, since the group is
# always released together.
version_format = "primary"

# The workspace version moves with the group, so a released tag describes a
# repository whose manifests agree with it.
versioned_files = [
	{ path = "Cargo.toml", type = "cargo", fields = ["workspace.package.version"] },
]

# One changelog at the root, listing every package. Each package's own
# changelog.md is still written by `[defaults.changelog]`; this is the
# human-readable summary of what went into a release.
changelog = { path = "changelog.md", format = "monochange", include = "all" }

