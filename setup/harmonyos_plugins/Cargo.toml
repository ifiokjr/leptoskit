[package]
name = "harmonyos_plugins"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
description = "A HarmonyOS host stand-in that depends on every runtime plugin crate, so CI can prove they compile for OHOS targets."

[lib]
crate-type = ["cdylib", "rlib"]

# Every plugin crate except `router`, which is a build plugin. Default features
# only: no plugin is selected, so no host glue is enabled.
[dependencies]
leptoskit_plugin_accelerometer = { path = "../../crates/leptoskit_plugin_accelerometer" }
