[package]
name = "leptoskit_devtools_ui"
version = "0.1.0"
edition = "2024"
publish = false
description = "The leptoskit DevTools interface: a leptoskit app that the DevTools hub serves."

# A standalone workspace, like the projects `leptoskit new` scaffolds: the
# interface is built with `leptoskit build --platform web`, which generates
# `.leptoskit/` beside it, so it stays out of the repository's workspace.
[workspace]
resolver = "2"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
# The browser client. `leptoskit build --platform web` builds for wasm32,
# where the dependencies below turn the web renderer on.
csr = []
# The browser DevTools panel, `src/panel.rs`, in place of the interface.
# `leptoskit build --platform extension` turns it on.
extension = ["csr", "leptoskit/extension"]

[dependencies]
leptoskit = { version = "=0.1.0", default-features = false, path = "../crates/leptoskit" }
leptoskit_devtools_protocol = { version = "=0.1.0", path = "../crates/leptoskit_devtools_protocol" }
# The panel's browser APIs, which do nothing on the host, so its screens are
# tested there like the interface's.
leptoskit_extension = { version = "=0.1.0", path = "../crates/leptoskit_extension" }
reactive_graph = "0.3.0-rc0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The interface only ever runs in a browser; on the host it is built for its
# tests, which render the same screens on the headless backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
leptos = { version = "0.9.0-rc0", default-features = false, features = ["csr"] }
leptoskit = { version = "=0.1.0", default-features = false, path = "../crates/leptoskit", features = ["web"] }
# The embedded wasm-bindgen CLI accepts exactly its matching library version.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["AbortSignal", "EventSource", "EventTarget", "Headers", "Location", "MessageEvent", "Request", "RequestCache", "RequestInit", "Response", "UrlSearchParams", "Window"] }

[dev-dependencies]
leptoskit_testing = { version = "=0.1.0", path = "../crates/leptoskit_testing" }

[profile.release]
lto = "thin"
codegen-units = 1

# Keep host proc-macros loadable on macOS 27 (rust-lang/rust#157750).
[profile.release.build-override]
strip = "none"
